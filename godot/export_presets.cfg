[preset.0]

name="Android arm64"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="audio/story_radio/manifest.json,audio/story_radio/KOKORO_LICENSE.txt"
# Until the owner approves the story voices, none of their imported streams may ship.
# Keep the manifest and license for cue provenance and the blocked-playback UI.
exclude_filter="tests/*, tools/*, audio/story_radio/*.ogg"
export_path="../build/apk/ScraperX-Claude-arm64.apk"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.cory.scraperx.claude"
package/name="ScraperX-Claude"
version/code=1
version/name="0.1.0"
screen/immersive_mode=true
permissions/vibrate=true
permissions/record_audio=true
launcher_icons/main_192x192="res://presentation/brand/launcher_192.png"
launcher_icons/adaptive_foreground_432x432="res://presentation/brand/adaptive_foreground_432.png"
launcher_icons/adaptive_background_432x432="res://presentation/brand/adaptive_background_432.png"
