# Hard caps on the Anthropic API credit (the owner's $100/month, Console). The switch checks spend in
# work/archive/runs.log (on the `switchboard/ledger` branch) before every paid call and refuses past
# any cap. Amounts are US dollars as strings; days and months are UTC. Set the Console's own monthly
# limit to $100 too: that is the backstop if anything here is wrong.
caps:
  month_usd: "100.00"   # may not exceed 100: the switch refuses to load a higher number
  day_usd: "10.00"
  job_usd: "8.00"       # per job, over its life; one comment `budget 12` on the job issue raises it (never above month_usd)

# List prices per million tokens. VOLATILE: from the claude-api skill's model table (cached 2026-10-06);
# check https://platform.claude.com/docs/en/about-claude/pricing when changing a model.
prices_per_mtok:
  claude-opus-5-5: {input: "4.00", output: "20.00"}

# Each paid call: worst case = counted input tokens x input price + max_tokens x output price.
calls:
  review:               # automatic review of a non-Claude PR (diff + checklist): worst case about $0.92
    model: claude-opus-5-5
    max_tokens: 16000
    effort: high
    max_input_tokens: 150000
  eye:                  # one vision call on the screenshot sets in work/looks/sets.yml: worst case about $0.40
    model: claude-opus-5-5
    max_tokens: 8000
    effort: medium
    max_input_tokens: 60000

# Step C, next week. OFF in v0: an issue labeled `job` and `needs:orchestrator` gets a note, not a session.
orchestrator:
  enabled: false
  agent_id: ""          # a Managed Agents agent id (agent_...), made in step C
  environment_id: ""    # its environment id (env_...)
  session_usd: "2.00"   # the hosted session's own hard budget; reserved in full against the caps

# The plan ($100 subscription) is not spent by the switch: live-eye sessions stay at most one open
# (design 2.4) and are opened by the integrator after asking the owner, as CLAUDE.md says.

max_log_bytes: 900000   # the switch refuses paid calls once runs.log grows past this: rotate it
