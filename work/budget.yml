# Hard caps on the Anthropic API credit (the owner's $100/month, Console). The switch checks spend in
# work/archive/runs.log (on the `switchboard/ledger` branch) before every paid call and refuses past
# any cap. Amounts are US dollars as strings; days and months are UTC. Set the Console's own monthly
# limit to $100 too: that is the backstop if anything here is wrong.
caps:
  month_usd: "100.00"   # may not exceed 100: the switch refuses to load a higher number
  day_usd: "100.00"    # no daily limit beyond the month (Cory, 11-03: "A $10 daily cap. That's so little. I don't want that there.")
  job_usd: "100.00"     # no per-job cap beyond the month (Cory 11-04: "the 8 was artificially unknowingly placed"; 11-07: canceled)

# List prices per million tokens. VOLATILE: from the claude-api skill's model table (cached 2026-10-06);
# check https://platform.claude.com/docs/en/about-claude/pricing when changing a model.
prices_per_mtok:
  claude-opus-5-5: {input: "4.00", output: "20.00"}
  claude-sonnet-5-5: {input: "2.00", output: "10.00"}

# Each paid call: worst case = counted input tokens x input price + max_tokens x output price.
calls:
  # The automatic review of a PR (diff + checklist) where Codex has not reviewed the head. Worst case = counted
  # input x $4/MTok + 64000 x $20/MTok: about $1.30 plus input (at most $0.60 more at 150,000 input tokens).
  # Cory, 11-04: Opus at max effort; streamed so a long think cannot time out (Sonnet xhigh once used all
  # 16,000 max_tokens with no verdict). To flip back, swap this line for the commented one below it.
  review: {model: claude-opus-5-5, effort: max, max_tokens: 64000, max_input_tokens: 150000}
  # review: {model: claude-sonnet-5-5, effort: xhigh, max_tokens: 16000, max_input_tokens: 150000}
  eye:                  # one vision call on the screenshot sets in work/looks/sets.yml: worst case about $0.40
    model: claude-opus-5-5
    max_tokens: 8000
    effort: medium
    max_input_tokens: 60000

# Step C (Cory, 11-03: build it now). The hosted API agent: a job issue labeled `job` and
# `needs:orchestrator` starts one Managed Agents session that mounts the repo, does the job on its own
# `claude/integrate-<job>` branch and opens a PR. It runs claude-opus-5-5 at high effort (Cory, 11-03;
# set at provisioning, tools/switchboard/provision_agent.py). The ids come from the workflow's `provision` dispatch; until
# they are filled in, a labeled issue gets a note, not a session.
orchestrator:
  enabled: false   # Cory, 11-04: "I just want the reviewer(s)": no new API agent sessions; the watcher still ends running ones
  agent_id: "agent_01N97aEHhD4VMkwztdqi4AjK"          # provision run 41659958364 (11-03), agent version 1
  environment_id: "env_01NVqATJMjSwjknrF6hXovuc"
  vault_id: "vlt_011CggCXtRkFLAxcGW7ZXbMi"    # GH_TOKEN for the GitHub REST API
  session_usd: "8.00"   # each session's own hard budget (Opus high); reserved in full against the day and job caps

# The plan ($100 subscription) is not spent by the switch: live-eye sessions stay at most one open
# (design 2.4) and are opened by the integrator after asking the owner, as CLAUDE.md says.

max_log_bytes: 900000   # the switch refuses paid calls once runs.log grows past this: rotate it
