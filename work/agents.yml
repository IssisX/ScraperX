# Who is on the team, for the switchboard (tools/switchboard). Read by the switch on every run.
# A LAND counts only from a vendor other than the author's. The author's vendor comes from the PR's
# branch prefix (every agent posts as the same GitHub account, so the login says nothing); a
# verdict's vendor comes from the first word of its first line, e.g. **ChatGPT (review of #88 @ f9575008): LAND**.
# Gemini is off the team (11-02). Codex reviews again (11-03): the Codex GitHub app reviews each PR when it
# opens and on "@codex review"; its summary comment is read as its verdict (rules.parse_codex_state).

# The repo is public, so anyone can comment. Only comments and reviews posted by these logins can
# carry a verdict (LAND, FIX, NOTE); every agent posts as IssisX, the eye as the workflow bot.
verdict_logins: [IssisX, "github-actions[bot]"]   # the Codex app's login is read only by parse_codex_state

agents:
  claude:
    vendor: anthropic
    names: [Claude]
    branch_prefixes: [claude/]
    owner_labels: [owner:claude, owner:claude-hold, owner:claude-lane-a, owner:claude-lane-b, owner:claude-switchboard]
    wake: api            # the only vendor the switch can wake by itself (reviews, the eye, the orchestrator)
  chatgpt:
    vendor: openai
    names: [ChatGPT]
    branch_prefixes: [chatgpt/]
    owner_labels: [owner:chatgpt]
    wake: manual         # runs when Cory starts it, plus a few scheduled tasks of its own (Cory 11-09); the switch never routes a review to it
  grok:
    vendor: xai
    names: [Grok, PE, Builder]       # PE and ScraperX Builder are Grok Bot (board #340)
    branch_prefixes: [grok/, pe/, builder/]
    owner_labels: [owner:grok, owner:pe, owner:builder]
    wake: issue
  codex:
    vendor: openai
    names: [Codex]
    branch_prefixes: [codex/]
    owner_labels: []
    wake: mention        # "@codex review" on the PR
  muse:
    vendor: meta
    names: [Muse, FB]                # Muse is FB Bot
    branch_prefixes: [muse/, fb-bot/]
    owner_labels: [owner:muse]
    wake: email          # tools/switchboard/muse_bridge.gs mails it and posts its replies back
    opens_prs: false     # Muse pushes its branches; the switchboard (else the integrator) opens the PRs (11-05)

review:
  # Reviews, one mechanism per PR (Cory, 11-04): the Codex app reviews every PR on open, and its summary comment
  # is the review (rules.parse_codex_state: clean at the exact head is a LAND, unresolved findings a FIX). Only a
  # head Codex has not reviewed gets the automatic Claude review once its proof is green. Muse is out of the
  # review pool. The two lists below are read only when `pool` is empty.
  # ChatGPT is `wake: manual`, so it is in none of these lists (the switch would drop it anyway: rules.py).
  claude_authored_asks: [grok]
  other_authored_asks: [grok]
  # Who shares the reviews Codex leaves: the automatic Claude review alone (`claude-api`, work/budget.yml). When
  # this list is set it replaces claude_authored_asks, other_authored_asks and the fallback escalation.
  pool: [claude-api]
  # The automatic Claude review takes Claude's PRs too, and its LAND counts there (Cory, 11-03: "Yes, give it real
  # work, the Claude on GitHub actions"). The Codex app still reviews every PR on open, and its findings block.
  api_reviews_claude: true
  # The last resort (Cory, 11-04): when neither Codex nor the API can review a head (a budget cap is hit, or the
  # API call failed or gave no verdict), one ask goes to Grok, polled by its own scheduled runs (the comment
  # starts "To Grok:"). Never a Claude agent, never the author's own vendor, never in the normal path, and
  # never ChatGPT (J-072: `wake: manual`, so nothing waits on it).
  fallback_after_hours: 1   # Cory, 11-03: "3 hours seems long"
  fallback_order: [grok]
