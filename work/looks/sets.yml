# The screenshot sets the eye judges (design 2.4). The frames are what the proof job
# `godot-audits-and-mix` in .github/workflows/wo000-delivery-spine.yml already captures and uploads
# as the artifact godot-audits-<run>-<attempt> (paths inside the zip). Add a set here, with its
# rubric, when a LOOK job adds a CI capture.
# `known_defect: J-NNN` (or a list) on a set: while that job's issue is open, the set's FIX is shown on
# every PR but blocks only the PR whose job it is (`Job: J-NNN`); once the issue closes, it blocks every PR
# again (rules.eye_overall, J-068). Never use it to excuse a defect no open job owns.
artifact_prefix: godot-audits-
sets:
  approach:
    rubric: work/looks/approach.md
    frames:
      - screenshots/wo006-approach-and-machine.png
  summit:
    rubric: work/looks/summit.md
    frames:
      - screenshots/summit_ending_hanging_beam.png
      - screenshots/summit_ending_seated_foreman.png
      - screenshots/summit_ending_city.png
      - screenshots/summit_ending_parachute.png
      - screenshots/summit_ending_home.png
  fight_contact:
    rubric: work/looks/fight_contact.md
    # Her reaction frame (arms flung to the frame's edges, a dark hole in her torso) is trunk's own, the
    # same on trunk and every branch (Muse on #307, 11-09, byte-identical stills); J-060's pose guard fixes it.
    known_defect: J-060
    frames:
      - screenshots/fight_punch_contact.png
      - screenshots/fight_punch_reaction.png
      - screenshots/injury/injury_face_front.png
      - screenshots/injury/injury_cheek_front.png
  ladder_descent:
    rubric: work/looks/ladder_descent.md
    # Her hands open and her body beside the rungs (seen 2026-11-08) are J-063's to fix.
    known_defect: J-063
    frames:
      - screenshots/ladder_grade_ladder_down.png
      - screenshots/ladder_grade_ladder_down_side.png
      - screenshots/ladder_grade_ladder_down_low.png
