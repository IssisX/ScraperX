name: ScraperX — ground screw ascent

on:
  push:
    branches: [ChatGPT]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraperx-ground-${{ github.sha }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7-stable
  GODOT_BINARY_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  GODOT_TEMPLATES_SHA256: 9714459dc071907c0f3d5f17d608faf69e7cda21331fc5d39c4503ffa4e99eec
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_VERSION: 29.0.14206865

jobs:
  ground-ascent:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build and Android tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ninja-build xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6
          SDKMANAGER_PATH="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "${SDKMANAGER_PATH}"
          yes | "${SDKMANAGER_PATH}" --licenses >/dev/null || true
          "${SDKMANAGER_PATH}" "platform-tools" "build-tools;36.1.0" "platforms;android-36" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install pinned Godot editor and Android template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/godot "${HOME}/.local/share/godot/export_templates/4.7.stable"
          curl --fail --location --retry 3 --output tools/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_BINARY_SHA256}  tools/godot/godot.zip" | sha256sum --check
          unzip -q tools/godot/godot.zip -d tools/godot
          mv "tools/godot/Godot_v${GODOT_VERSION}_linux.x86_64" tools/godot/godot
          chmod +x tools/godot/godot
          curl --fail --location --retry 3 --output tools/godot/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  tools/godot/templates.tpz" | sha256sum --check
          unzip -q -j tools/godot/templates.tpz templates/android_debug.apk \
            -d "${HOME}/.local/share/godot/export_templates/4.7.stable"
          tools/godot/godot --version

      - name: Build native stage and run causal tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCRAPERX_BUILD_BRIDGE=ON
          cmake --build build/host --target scraperx_sim_tests scraperx_native --parallel 2
          mkdir -p artifacts
          ctest --test-dir build/host --output-on-failure | tee artifacts/native-tests.log
          ./build/host/scraperx_sim_tests | tee artifacts/native-proof.log
          grep -F 'PASS ground screw ascent' artifacts/native-proof.log

      - name: Import and run the real player ride
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; if [ "$status" -ne 0 ]; then grep -E "SCRIPT ERROR|SCRAPERX_ASCENT_FAIL|ERROR:" artifacts/godot-import.log artifacts/godot-ride.log 2>/dev/null | tail -n 12 | while IFS= read -r line; do echo "::error::$line"; done || true; fi' EXIT
          mkdir -p artifacts/screenshots godot/.godot
          printf '%s\n' 'res://addons/scraperx_native/scraperx_native.gdextension' > godot/.godot/extension_list.cfg
          tools/godot/godot --headless --path godot --editor --quit 2>&1 | tee artifacts/godot-import.log
          timeout 300s xvfb-run -a -s '-screen 0 1296x1114x24' \
            tools/godot/godot --path godot --rendering-method gl_compatibility --fixed-fps 90 \
            --script res://tests/ascent_smoke.gd \
            -- '--capture=artifacts/screenshots/ground-ascent.png' \
            2>&1 | tee artifacts/godot-ride.log
          grep -F 'SCRAPERX_ASCENT_PASS' artifacts/godot-ride.log
          test -s artifacts/screenshots/ground-ascent.png
          if grep -E 'SCRIPT ERROR|Parse Error|SCRAPERX_ASCENT_FAIL' artifacts/godot-import.log artifacts/godot-ride.log; then exit 1; fi

      - name: Cross-compile Android arm64 native stage
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/android-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DSCRAPERX_BUILD_BRIDGE=ON
          cmake --build build/android-arm64 --target scraperx_native --parallel 2
          test -s godot/addons/scraperx_native/bin/android/arm64/libscraperx_native.so

      - name: Export Android arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk build/apk
          APK_NAME="ScraperX-ground-${GITHUB_SHA::12}-arm64.apk"
          tools/godot/godot --headless --path godot --export-debug 'Android arm64' \
            "${GITHUB_WORKSPACE}/build/apk/${APK_NAME}" 2>&1 | tee artifacts/godot-android-export.log
          test -s "build/apk/${APK_NAME}"
          unzip -l "build/apk/${APK_NAME}" | tee artifacts/apk-contents.log
          grep -F 'lib/arm64-v8a/libscraperx_native.so' artifacts/apk-contents.log
          cp "build/apk/${APK_NAME}" artifacts/apk/
          sha256sum "artifacts/apk/${APK_NAME}" > artifacts/apk/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ScraperX-ground-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
