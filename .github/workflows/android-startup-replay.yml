name: Android startup replay (diagnostic, not release)
run-name: Android replay — ${{ inputs.device_profile }} — APK ${{ inputs.apk_source }}

on:
  workflow_dispatch:
    inputs:
      device_profile:
        description: Representative modern device path
        default: compact-api34
        required: true
        type: choice
        options: [compact-api34, tablet-api36, foldable-api35]
      apk_run:
        description: Existing Android compatibility APK build run
        default: '39066063158'
        required: true
        type: string
      apk_source:
        description: Full source SHA embedded in that APK
        default: f3544cb10f12e0ae2b12f73af5cdfe06224f0bfb
        required: true
        type: string
      startup_font_scale:
        description: Controlled OS font-size change immediately after launching
        default: 'none'
        required: true
        type: choice
        options: ['1.25', 'none']

permissions:
  contents: read
  actions: read

jobs:
  startup-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APK_RUN: ${{ inputs.apk_run }}
      APK_SOURCE: ${{ inputs.apk_source }}
      STARTUP_FONT_SCALE: ${{ inputs.startup_font_scale }}
      DEVICE_PROFILE: ${{ inputs.device_profile }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the matching device path
        id: device
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          profiles = {
              'compact-api34': (34, 'pixel_6a', '1440x720', ''),
              'tablet-api36': (36, 'pixel_c', '1920x1200', '--display-route'),
              'foldable-api35': (35, '7.6in Foldable', '1080x2092', ''),
          }
          api, hardware, resize, route = profiles[os.environ['DEVICE_PROFILE']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in dict(api=api, hardware=hardware, resize=resize, route=route).items():
                  print(f'{key}={value}', file=output)
          PY
      - name: Fetch identified existing APK without rebuilding native code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'[1-9][0-9]*', os.environ['APK_RUN']):
              raise SystemExit('APK_RUN must be a positive GitHub run ID')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['APK_SOURCE']):
              raise SystemExit('APK_SOURCE must be a full source SHA')
          PY
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${APK_RUN}" --jq .head_sha)" = "${APK_SOURCE}"
          gh run download "${APK_RUN}" --repo "${GITHUB_REPOSITORY}" \
            --name "android-emulator-apk-${APK_SOURCE}" --dir artifacts/existing-apk
          test "$(cat artifacts/existing-apk/source-sha.txt)" = "${APK_SOURCE}"
          mkdir -p artifacts/startup-replay
          printf '%s\n' "${GITHUB_SHA}" > artifacts/startup-replay/diagnostic-harness-source.txt
          printf '%s\n' "${APK_SOURCE}" > artifacts/startup-replay/game-apk-source.txt
          sha256sum artifacts/existing-apk/ScraperX-emulator.apk > artifacts/startup-replay/APK-SHA256.txt
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Fresh device boot with continuous configuration event capture
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ steps.device.outputs.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ steps.device.outputs.hardware }}
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: bash ci/android_emulator_host.sh artifacts/startup-replay '${{ steps.device.outputs.hardware }}'
          script: >-
            python3 ci/android_startup_replay.py
            --apk artifacts/existing-apk/ScraperX-emulator.apk
            --source "${APK_SOURCE}" --profile "${DEVICE_PROFILE}"
            --resize ${{ steps.device.outputs.resize }} --output artifacts/startup-replay
            --startup-font-scale "${STARTUP_FONT_SCALE}"
            ${{ steps.device.outputs.route }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-replay-${{ github.sha }}
          path: artifacts/startup-replay/
          if-no-files-found: warn
