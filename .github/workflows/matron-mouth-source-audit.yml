name: Temporary build verified Matron CC0 mouth recordings
on:
  push:
    branches:
      - chatgpt/matron-mouth-takes-20261029
permissions:
  contents: write
jobs:
  write-real-takes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the isolated feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install audio preparation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify immutable CC0 source bytes and prepare natural takes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audio/matron_mouth_takes.py
      - name: Commit and push only the authentic audio and keep-import files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ScraperX CC0 audio preparation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            godot/presentation/audio/matron/matron_croak_0.ogg \
            godot/presentation/audio/matron/matron_croak_1.ogg \
            godot/presentation/audio/matron/matron_croak_2.ogg \
            godot/presentation/audio/matron/matron_croak_3.ogg \
            godot/presentation/audio/matron/matron_cluck_0.ogg \
            godot/presentation/audio/matron/matron_cluck_1.ogg \
            godot/presentation/audio/matron/matron_cluck_2.ogg \
            godot/presentation/audio/matron/matron_cluck_3.ogg \
            godot/presentation/audio/matron/matron_sniff_0.ogg \
            godot/presentation/audio/matron/matron_sniff_1.ogg \
            godot/presentation/audio/matron/matron_sniff_2.ogg \
            godot/presentation/audio/matron/matron_sniff_3.ogg \
            godot/presentation/audio/matron/matron_croak_0.ogg.import \
            godot/presentation/audio/matron/matron_croak_1.ogg.import \
            godot/presentation/audio/matron/matron_croak_2.ogg.import \
            godot/presentation/audio/matron/matron_croak_3.ogg.import \
            godot/presentation/audio/matron/matron_cluck_0.ogg.import \
            godot/presentation/audio/matron/matron_cluck_1.ogg.import \
            godot/presentation/audio/matron/matron_cluck_2.ogg.import \
            godot/presentation/audio/matron/matron_cluck_3.ogg.import \
            godot/presentation/audio/matron/matron_sniff_0.ogg.import \
            godot/presentation/audio/matron/matron_sniff_1.ogg.import \
            godot/presentation/audio/matron/matron_sniff_2.ogg.import \
            godot/presentation/audio/matron/matron_sniff_3.ogg.import
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Add 12 independent CC0 Matron mouth performances"
          git push origin HEAD:refs/heads/chatgpt/matron-mouth-takes-20261029
