name: Temporary Matron mouth rule check
on:
  push:
    branches: [chatgpt/matron-mouth-takes-20261029]
permissions:
  contents: read
jobs:
  check-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Review exact feature diff against ScraperX-Claude
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin ScraperX-Claude
          set +e
          python3 tools/rule_check/rule_check.py origin/ScraperX-Claude HEAD > /tmp/matron-rule-check.out
          code=$?
          set -e
          cat /tmp/matron-rule-check.out
          echo "RULE_CHECK_EXIT=${code}"
          if [ "${code}" -gt 2 ]; then exit "${code}"; fi
