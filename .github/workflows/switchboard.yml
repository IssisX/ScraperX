name: Switchboard
# J-072: the run says what it is, so a dry run never passes for a sweep. The bridge's watchdog
# (tools/switchboard/muse_bridge.gs, SWEEP_TITLE) counts only a successful "Switchboard sweep" as alive.
# A sweep the bridge's clock dispatches is named "Switchboard sweep (bridge <BRIDGE_VERSION>)", so the switch can
# tell a stale or missing live bridge from the repo's (switch.py bridge_version_health).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && (inputs.provision && 'Switchboard provision' ||
  inputs.dry_run && 'Switchboard DRY run (takes no action)' || inputs.digest && 'Switchboard digest' ||
  inputs.bridge_version && format('Switchboard sweep (bridge {0})', inputs.bridge_version) ||
  'Switchboard sweep') || github.event_name == 'schedule' && (github.event.schedule == '0 12,13 * * *' &&
  'Switchboard digest' || 'Switchboard sweep') || format('Switchboard ({0})', github.event_name) }}

# The wake switch and merger of design v3 step B (job J-031). No model decides here: see
# tools/switchboard/switch.py and work/CONTEXT.md.
#
# Every event except pull_request runs this file from the DEFAULT branch (`main`), so the switch is
# live only once this file is on `main` too. Each run checks out trunk (ScraperX-Claude) for the code
# and config. No third-party action is used: the checkout is plain git over the public URL, so no
# credential is written to disk. The one action is GitHub's own actions/cache (J-072, the switch's ETag
# cache): its file holds GitHub answers the run could read anyway, never a token. Event text (titles, bodies, labels) reaches the scripts only through
# env, quoted, never through an expression inside `run:`.

# No workflow_run trigger (J-072). It last fired 11-05 12:11Z: `workflows:` entries are glob patterns, and
# the proof's name on trunk has a `+` ("...WO-000..013 + ascent..."), which a glob reads as "one or more
# spaces", so the name never matched once the default branch moved to trunk (main's old name had no
# glob character). It is not restored: the proof's own wake-switchboard job dispatches a full sweep as it
# ends, and the Muse bridge dispatches one every 10 min; a targeted workflow_run run in the shared
# concurrency group below would only replace that pending full sweep. Re-adding it needs `\+` for each `+`.
on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  schedule:
    - cron: "3,18,33,48 * * * *"   # the sweep, every 15 minutes; GitHub drops most of these, so the Muse
                                   # bridge's clock (muse_bridge.gs) dispatches the real one every 10 min
    - cron: "0 12,13 * * *"   # the digest: whichever of these is 7:00 AM Central posts it (CDT, then CST)
  workflow_dispatch:
    inputs:
      # J-072: false by default. A dispatch is meant (a dry default gave a green run that did nothing); the
      # bridge's clock and the proof's wake pass dry_run=false anyway, and a dry run is named DRY in the run list.
      dry_run:
        description: Print every action, take none (the run is then named DRY)
        type: boolean
        default: false
      digest:
        description: Post (or print) the digest now
        type: boolean
        default: false
      provision:
        description: One-time setup of the hosted API agent (creates its environment, agent and vault)
        type: boolean
        default: false
      # J-072: sent by the Muse bridge's clock (muse_bridge.gs BRIDGE_VERSION); it only names the run.
      bridge_version:
        description: The live Muse bridge's version (set by the bridge's clock; leave empty)
        type: string
        default: ""
  pull_request:
    branches: [ScraperX-Claude]
    paths:
      - "tools/switchboard/**"
      - "work/*.yml"
      - "work/looks/**"
      - ".github/workflows/switchboard.yml"

permissions: {}

concurrency:
  # The one-time provision dispatch gets its own group: in the shared one a newer queued run replaces it.
  # A comment or label event that the jobs below will skip gets a group of its own too (11-03): GitHub keeps
  # one pending run per group and cancels the older one, so idle comment runs, several a minute, were
  # displacing the proof-finished and scheduled runs that do the reviews, the eye and the sweep.
  group: >-
    ${{ github.event_name == 'pull_request' && format('switchboard-selftest-{0}', github.ref) ||
    (inputs.provision && 'switchboard-provision' ||
    (((github.event_name == 'issue_comment' && !(github.event.issue.pull_request &&
    (contains(github.event.comment.body, ': LAND') || contains(github.event.comment.body, ': FIX') ||
    contains(github.event.comment.body, ': NOTE') || contains(github.event.comment.body, ': BLOCK') ||
    contains(github.event.comment.body, 'codex-review-receipt')))) ||
    (github.event_name == 'issues' && github.event.label.name != 'needs:orchestrator' &&
    !startsWith(github.event.label.name, 'owner:'))) &&
    format('switchboard-idle-{0}', github.run_id) || 'switchboard')) }}
  cancel-in-progress: false

env:
  TRUNK: ScraperX-Claude
  PYTHONUNBUFFERED: "1"   # J-072: each log line is stamped when printed, so a slow or timed-out step shows where
  # J-072: the switch's ETag cache (ghapi.py): restored before and saved after the switch step of ask and steer;
  # a 304 answer does not count against the 5,000-an-hour limit (run 42667757904 hit it).
  SWITCHBOARD_ETAG_CACHE: etags.json
  # J-072: the live bridge's version, as its clock dispatched this sweep ("" for any other event): the switch checks
  # it against trunk's every sweep with no read (switch.py BRIDGE_VERSION_ENV). A hex string the clock sends; the
  # switch only compares it, never runs it.
  SWITCHBOARD_BRIDGE_VERSION: ${{ inputs.bridge_version }}

jobs:
  # A PR that changes the switch: its unit tests and a dry run against the live repo. Read-only, no secrets.
  selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - name: Check out the PR's merge commit
        env:
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --no-checkout "https://github.com/${REPO}.git" src
          git -C src fetch -q --no-tags origin "+refs/pull/${PR}/merge:refs/remotes/pr/merge" "+refs/heads/${TRUNK}:refs/remotes/origin/${TRUNK}"
          git -C src checkout -q --detach refs/remotes/pr/merge
      - name: Install the hash-pinned dependencies (wheels only)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r src/tools/switchboard/requirements.txt
      - name: Unit tests of the switch's decisions
        run: .venv/bin/python -m unittest discover -s src/tools/switchboard -p 'test_*.py' -v
      - name: Dry run against the live repo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          .venv/bin/python src/tools/switchboard/switch.py --dry-run --repo "$REPO"
          .venv/bin/python src/tools/switchboard/switch.py --dry-run --repo "$REPO" --part steer --force-digest

  # The paid part: the automatic Claude review, the eye, the orchestrator (off in v0). The only job
  # holding ANTHROPIC_API_KEY. Its code never merges; contents: write is for the ledger branch.
  ask:
    # J-056: it signs the automatic reviews with SWITCHBOARD_REVIEW_KEY, which lives only in this environment
    # (deploys only from ScraperX-Claude), so no branch's copy of any workflow can sign a forged security pass.
    environment: switchboard-merge
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '3,18,33,48 * * * *') ||
      (github.event_name == 'issues' && github.event.label.name == 'needs:orchestrator') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (contains(github.event.comment.body, ': LAND') || contains(github.event.comment.body, ': FIX') ||
         contains(github.event.comment.body, ': NOTE') || contains(github.event.comment.body, ': BLOCK') ||
         contains(github.event.comment.body, 'codex-review-receipt')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write        # appends work/archive/runs.log on the switchboard/ledger branch
      issues: write          # verdict and note comments
      pull-requests: write   # comments on PRs
      actions: read          # proof runs and the screenshot artifact
    steps:
      - name: Check out trunk
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --branch "$TRUNK" --single-branch "https://github.com/${REPO}.git" src
      - name: Install the hash-pinned dependencies (wheels only)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r src/tools/switchboard/requirements.txt
      - name: Restore the ETag cache (J-072)
        uses: actions/cache/restore@v4
        with:
          path: etags.json
          key: switchboard-etags-ask-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: switchboard-etags-ask-
      - name: Run the switch
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          # J-056: signs each automatic review (an HMAC); switch.py takes it out of the environment at start.
          SWITCHBOARD_REVIEW_KEY: ${{ secrets.SWITCHBOARD_REVIEW_KEY }}
          PART: ${{ github.job }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
          DISPATCH_DRY: ${{ inputs.dry_run }}
          DISPATCH_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          args=(--part "$PART" --repo "$REPO" --root src)
          case "$EVENT" in
            issue_comment) args+=(--pr "$ISSUE_NUMBER") ;;
            issues) args+=(--issue "$ISSUE_NUMBER" --label "$LABEL") ;;
            schedule) if [ "$SCHEDULE" = "0 12,13 * * *" ]; then args+=(--digest); fi ;;
            workflow_dispatch)
              if [ "$DISPATCH_DIGEST" = "true" ]; then args+=(--force-digest); fi
              if [ "$DISPATCH_DRY" != "false" ]; then args+=(--dry-run); fi ;;
          esac
          .venv/bin/python src/tools/switchboard/switch.py "${args[@]}"
      - name: Save the ETag cache (J-072)
        if: always() && hashFiles('etags.json') != ''
        uses: actions/cache/save@v4
        with:
          path: etags.json
          key: switchboard-etags-ask-${{ github.run_id }}-${{ github.run_attempt }}

  # One-time setup of the hosted API agent (step C): only on a dispatch with provision=true. It prints
  # the new ids to the run summary for work/budget.yml; it never prints a secret.
  provision:
    # J-057: ANTHROPIC_API_KEY and AGENT_GITHUB_TOKEN live only in this environment (deploys only from ScraperX-Claude),
    # like the merge token, so no branch's copy of any workflow can read them.
    environment: switchboard-merge
    if: github.event_name == 'workflow_dispatch' && inputs.provision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trunk
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --branch "$TRUNK" --single-branch "https://github.com/${REPO}.git" src
      - name: Install the hash-pinned dependencies (wheels only)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r src/tools/switchboard/requirements.txt
      - name: Create the environment, agent and vault
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          .venv/bin/python src/tools/switchboard/provision_agent.py

  # The free part: the merge rule, review asks, one owner per issue, the digest. No API key.
  steer:
    needs: ask
    # J-056 security pass: SWITCHBOARD_MERGE_TOKEN lives only in this environment, which deploys only from
    # ScraperX-Claude, so a branch's copy of this file (pull_request, or a dispatch on another ref) cannot read it.
    environment: switchboard-merge
    if: >-
      always() && github.event_name != 'pull_request' && needs.ask.result != 'cancelled' && (
        github.event_name != 'issues' || startsWith(github.event.label.name, 'owner:')
      ) && (
        github.event_name != 'issue_comment' || (github.event.issue.pull_request &&
          (contains(github.event.comment.body, ': LAND') || contains(github.event.comment.body, ': FIX') ||
           contains(github.event.comment.body, ': NOTE') || contains(github.event.comment.body, ': BLOCK') ||
           contains(github.event.comment.body, 'codex-review-receipt')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # the merge
      issues: write          # labels, notes, the Digest issue
      pull-requests: write   # the merge and PR comments
      actions: write         # dispatch the trunk proof after a merge (a token merge starts no push run)
    steps:
      - name: Check out trunk
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --branch "$TRUNK" --single-branch "https://github.com/${REPO}.git" src
      - name: Install the hash-pinned dependencies (wheels only)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r src/tools/switchboard/requirements.txt
      - name: Restore the ETag cache (J-072)
        uses: actions/cache/restore@v4
        with:
          path: etags.json
          key: switchboard-etags-steer-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: switchboard-etags-steer-
      - name: Run the switch
        env:
          GH_TOKEN: ${{ github.token }}
          # J-056: a fine-grained PAT (Contents, Pull requests, Workflows: read/write) that merges a PR changing
          # .github/workflows, which github.token cannot. This step and no other: it runs trunk's switch.py only,
          # never PR-head code (the rule check reads the PR's diff; nothing checks it out). switch.py takes it out
          # of the environment at start, so no child process inherits it.
          SWITCHBOARD_MERGE_TOKEN: ${{ secrets.SWITCHBOARD_MERGE_TOKEN }}
          # J-056: checks the MAC of the security pass before the merge token is used; taken out the same way.
          SWITCHBOARD_REVIEW_KEY: ${{ secrets.SWITCHBOARD_REVIEW_KEY }}
          # J-072: optional Healthchecks.io ping URL, pinged once at the end of a full non-dry sweep (/fail when
          # any part errored); switch.py takes it out of the environment at start. Unset: no ping.
          HC_SWEEP_URL: ${{ secrets.HC_SWEEP_URL }}
          PART: ${{ github.job }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
          DISPATCH_DRY: ${{ inputs.dry_run }}
          DISPATCH_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          args=(--part "$PART" --repo "$REPO" --root src)
          case "$EVENT" in
            issue_comment) args+=(--pr "$ISSUE_NUMBER") ;;
            issues) args+=(--issue "$ISSUE_NUMBER" --label "$LABEL") ;;
            schedule) if [ "$SCHEDULE" = "0 12,13 * * *" ]; then args+=(--digest); fi ;;
            workflow_dispatch)
              if [ "$DISPATCH_DIGEST" = "true" ]; then args+=(--force-digest); fi
              if [ "$DISPATCH_DRY" != "false" ]; then args+=(--dry-run); fi ;;
          esac
          .venv/bin/python src/tools/switchboard/switch.py "${args[@]}"
      - name: Save the ETag cache (J-072)
        if: always() && hashFiles('etags.json') != ''
        uses: actions/cache/save@v4
        with:
          path: etags.json
          key: switchboard-etags-steer-${{ github.run_id }}-${{ github.run_attempt }}

