name: Switchboard
# J-072: the run says what it is, so a dry run never passes for a sweep. The bridge's watchdog
# (tools/switchboard/muse_bridge.gs, SWEEP_TITLE) counts only a successful "Switchboard sweep" as alive.
# A sweep the bridge's clock dispatches is named "Switchboard sweep (bridge <BRIDGE_VERSION>)", so the switch can
# tell a stale or missing live bridge from the repo's (switch.py bridge_version_health).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && (inputs.part == 'ask' && (inputs.dry_run &&
  'Switchboard reviews DRY run (takes no action)' || 'Switchboard reviews') ||
  inputs.provision && 'Switchboard provision' ||
  inputs.dry_run && 'Switchboard DRY run (takes no action)' || inputs.digest && 'Switchboard digest' ||
  inputs.bridge_version && format('Switchboard sweep (bridge {0})', inputs.bridge_version) ||
  'Switchboard sweep') || github.event_name == 'schedule' && (github.event.schedule == '0 12,13 * * *' &&
  'Switchboard digest' || 'Switchboard sweep') || format('Switchboard ({0})', github.event_name) }}

# The wake switch and merger of design v3 step B (job J-031). No model decides here: see
# tools/switchboard/switch.py and work/CONTEXT.md.
#
# Every event except a push (the selftest) runs this file from the DEFAULT branch, which is trunk (ScraperX-Claude; it
# was `main` until the default moved, J-072 checked 11-09). Each run checks out trunk for the code
# and config. No third-party action is used: the checkout is plain git over the public URL, so no
# credential is written to disk. The only actions are GitHub's own actions/cache, upload-artifact and
# download-artifact (J-072, the switch's ETag cache): its file holds GitHub answers the run could read anyway, never
# a token. Any job on trunk can save an Actions cache entry, and a restore unpacks the whole archive, so the cache
# is restored and saved only in the cache-in and cache-out jobs, which hold no secret, run no checked-out code and
# have no token scope beyond deleting old cache entries; ask and steer get the one signed file as this run's
# artifact in $RUNNER_TEMP, never in the workspace or the venv (the security pass on #360). Event text (titles,
# bodies, labels) reaches the scripts only through env, quoted, never through an expression inside `run:`.

# No workflow_run trigger (J-072). It last fired 11-05 12:11Z: `workflows:` entries are glob patterns, and
# the proof's name on trunk has a `+` ("...WO-000..013 + ascent..."), which a glob reads as "one or more
# spaces", so the name never matched once the default branch moved to trunk (main's old name had no
# glob character). It is not restored: the proof's own wake-switchboard job dispatches a full sweep as it
# ends, and the Muse bridge dispatches one every 10 min; a targeted workflow_run run in the shared
# concurrency group below would only replace that pending full sweep. Re-adding it needs `\+` for each `+`.
on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  schedule:
    - cron: "3,18,33,48 * * * *"   # the sweep, every 15 minutes; GitHub drops most of these, so the Muse
                                   # bridge's clock (muse_bridge.gs) dispatches the real one every 10 min
    - cron: "0 12,13 * * *"   # the digest: whichever of these is 7:00 AM Central posts it (CDT, then CST)
  workflow_dispatch:
    inputs:
      # J-072: false by default. A dispatch is meant (a dry default gave a green run that did nothing); the
      # bridge's clock and the proof's wake pass dry_run=false anyway, and a dry run is named DRY in the run list.
      dry_run:
        description: Print every action, take none (the run is then named DRY)
        type: boolean
        default: false
      digest:
        description: Post (or print) the digest now
        type: boolean
        default: false
      provision:
        description: One-time setup of the hosted API agent (creates its environment, agent and vault)
        type: boolean
        default: false
      # J-072: sent by the Muse bridge's clock (muse_bridge.gs BRIDGE_VERSION); it only names the run.
      bridge_version:
        description: The live Muse bridge's version (set by the bridge's clock; leave empty)
        type: string
        default: ""
      # 11-13: the reviews run on their own (the wake-ask job starts them; see the concurrency group). Empty: a sweep.
      part:
        description: Leave empty for a sweep; "ask" runs only the reviews, the eye and the orchestrator (wake-ask sets it)
        type: string
        default: ""
      issue:
        description: With part=ask, the job issue labeled needs:orchestrator (digits; set by wake-ask)
        type: string
        default: ""
  # 11-13: the selftest runs on a push, not on a pull_request event. The switchboard opens the claude/integrate-* PRs
  # with the workflow token, and GitHub holds a pull_request run that github-actions[bot] triggers for someone's
  # approval ("action_required" on #503 and #505, a pop-up for Cory), or fails it at the start (#500, #502). A push
  # is the agent's own, so its run needs no approval, and it comes once per head, not again for every PR event.
  # Every branch but trunk, and no paths filter: a PR can come from any branch, and a paths filter sees only the
  # pushed commits, so a follow-up push that touches no switch file would leave the PR's new head untested. The
  # selftest's first step decides instead, from the whole branch against trunk, and ends at once when none changed.
  # The switchboard's own branches (the ledger, state and merge candidates) and the integrator's inbox PR are never
  # a change to land: they are left out.
  push:
    branches-ignore: [ScraperX-Claude, 'switchboard/**', claude/integrator-inbox]

permissions: {}

concurrency:
  # 11-13: the reviews run in their own run and group (switchboard-ask). A run keeps its group until its last job
  # ends, and the ask job reviews one PR after another (one security review took 744 s, five took 1,570 s), so with
  # ask in the sweep's run the merges, auto-open and the inbox waited behind the reviews and queued sweeps were
  # replaced. Each group runs one run at a time, and each run restores and saves only its own part's ETag file
  # (cache-in, cache-out), so each file still has one writer at a time, and only the steer part keeps ledger timers.
  # The one-time provision dispatch gets its own group: in the shared one a newer queued run replaces it.
  # A comment or label event that the jobs below will skip gets a group of its own too (11-03): GitHub keeps
  # one pending run per group and cancels the older one, so idle comment runs, several a minute, were
  # displacing the proof-finished and scheduled runs that do the reviews, the eye and the sweep.
  group: >-
    ${{ github.event_name == 'push' && format('switchboard-selftest-{0}', github.ref) ||
    inputs.part == 'ask' && 'switchboard-ask' ||
    (inputs.provision && 'switchboard-provision' ||
    (((github.event_name == 'issue_comment' && !(github.event.issue.pull_request &&
    (contains(github.event.comment.body, ': LAND') || contains(github.event.comment.body, ': FIX') ||
    contains(github.event.comment.body, ': NOTE') || contains(github.event.comment.body, ': BLOCK') ||
    contains(github.event.comment.body, 'codex-review-receipt')))) ||
    (github.event_name == 'issues' && github.event.label.name != 'needs:orchestrator' &&
    !startsWith(github.event.label.name, 'owner:'))) &&
    format('switchboard-idle-{0}', github.run_id) || 'switchboard')) }}
  cancel-in-progress: false

env:
  TRUNK: ScraperX-Claude
  PYTHONUNBUFFERED: "1"   # J-072: each log line is stamped when printed, so a slow or timed-out step shows where
  # J-072: the live bridge's version, as its clock dispatched this sweep ("" for any other event): the switch checks
  # it against trunk's every sweep with no read (switch.py BRIDGE_VERSION_ENV). A hex string the clock sends; the
  # switch only compares it, never runs it.
  SWITCHBOARD_BRIDGE_VERSION: ${{ inputs.bridge_version }}

jobs:
  # A branch that changes the switch: its unit tests and a dry run against the live repo. Read-only, no secrets.
  selftest:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      # What would land, as the pull_request run's refs/pull/N/merge was: the pushed head with trunk merged in. The
      # files that decide whether it runs were that trigger's paths filter, now read from the whole branch against
      # trunk (its merge base), so every push to a branch that changes the switch is tested, whatever it touched.
      - name: Check out the pushed head with trunk merged in, if the branch changes the switch
        id: scope
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SWITCH_FILES: '^(tools/switchboard/|work/[^/]+\.yml$|work/looks/|\.github/workflows/switchboard\.yml$)'
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --no-checkout "https://github.com/${REPO}.git" src
          git -C src fetch -q --no-tags origin "$SHA" "+refs/heads/${TRUNK}:refs/remotes/origin/${TRUNK}"
          git -C src checkout -q --detach "$SHA"
          if ! git -C src merge-base "origin/${TRUNK}" "$SHA" > /dev/null; then
            echo "::notice::this branch shares no history with ${TRUNK}: no switch change to test"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git -C src diff --no-renames --name-only "origin/${TRUNK}...${SHA}")
          if ! grep -qE "$SWITCH_FILES" <<< "$changed"; then
            echo "::notice::this branch changes no switch file against ${TRUNK}: nothing to test"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git -C src -c user.name=selftest -c user.email=selftest@invalid merge -q --no-edit "origin/${TRUNK}"; then
            echo "::error::this branch conflicts with ${TRUNK}: merge ${TRUNK} into it"
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Install the hash-pinned dependencies (wheels only)
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r src/tools/switchboard/requirements.txt
      - name: Unit tests of the switch's decisions
        if: steps.scope.outputs.run == 'true'
        run: .venv/bin/python -m unittest discover -s src/tools/switchboard -p 'test_*.py' -v
      # Cory 11-12, "only run what changed": the dry run cost 550 to 1,368 calls of the repo's shared hourly
      # GitHub limit (it starved the live sweep on #476). A draft PR runs only the unit tests above, and so does a
      # branch with no PR unless it is an */integrate-* branch (the switchboard opens its PR, never as a draft). A
      # ready PR runs the dry run too; a PR marked ready gets it on its next push. 11-13: a dry run's own budget is
      # 300 calls (switch.py CALL_BUDGET), so both together cost at most 600.
      - name: Dry run against the live repo, unless the branch's PR is a draft
        if: steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! pr=$(gh api -X GET "repos/$REPO/pulls" -f head="$OWNER:$BRANCH" -f base="$TRUNK" -f state=open \
              --jq 'if length == 0 then "none" elif .[0].draft then "draft" else "ready" end' 2> /dev/null); then
            echo "::warning::the branch's PR was not read, so the dry run is skipped; the next push runs it"
            exit 0
          fi
          if [ "$pr" = draft ]; then
            echo "::notice::the branch's PR is a draft: unit tests only; the dry run waits for a push to it once ready"
            exit 0
          fi
          if [ "$pr" = none ] && [[ "$BRANCH" != */integrate-* ]]; then
            echo "::notice::no PR and not an integrate branch: unit tests only; the dry run waits for a ready PR"
            exit 0
          fi
          .venv/bin/python src/tools/switchboard/switch.py --dry-run --repo "$REPO"
          .venv/bin/python src/tools/switchboard/switch.py --dry-run --repo "$REPO" --part steer --force-digest

  # J-072: the switch's ETag cache (ghapi.py; a 304 answer does not count against the hourly limit, and run
  # 42667757904 hit it). The security pass on #360: any job on trunk can save an entry under these keys, and the
  # restore unpacks the whole archive, absolute paths too. So it is restored here, in a job with no secret, no token
  # scope, no checkout and no step of its own code, and only the one file goes on, as an artifact of this run; ask
  # and steer read it in $RUNNER_TEMP once its MAC checks (ghapi.load_etags). One cache scope: every event but a
  # push runs on the default branch, trunk, a run on any other ref skips the cache. Each part's file goes through
  # its own runs only (a reviews run, part=ask, restores and saves the ask file; every other run the steer file),
  # and each part's runs are serialized by its own concurrency group, so no file has two writers at once, its state
  # never diverges, and a cached ledger timer (the steer part's) never fires twice.
  cache-in:
    if: >-
      github.ref == 'refs/heads/ScraperX-Claude' && github.event_name != 'push' && !inputs.provision && (
        github.event_name != 'issues' || startsWith(github.event.label.name, 'owner:')
      ) && (
        github.event_name != 'issue_comment' || (github.event.issue.pull_request &&
          (contains(github.event.comment.body, ': LAND') || contains(github.event.comment.body, ': FIX') ||
           contains(github.event.comment.body, ': NOTE') || contains(github.event.comment.body, ': BLOCK') ||
           contains(github.event.comment.body, 'codex-review-receipt')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Restore the ask part's ETag cache
        if: inputs.part == 'ask'
        uses: actions/cache/restore@v4
        with:
          path: ask/etags.json
          key: switchboard-etags-ask-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: switchboard-etags-ask-
      - name: Hand on the ask part's file, and nothing else
        if: inputs.part == 'ask'
        uses: actions/upload-artifact@v4
        with:
          name: switchboard-etags-ask
          path: ask/etags.json
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true
      - name: Restore the steer part's ETag cache
        if: inputs.part != 'ask'
        uses: actions/cache/restore@v4
        with:
          path: steer/etags.json
          key: switchboard-etags-steer-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: switchboard-etags-steer-
      - name: Hand on the steer part's file, and nothing else
        if: inputs.part != 'ask'
        uses: actions/upload-artifact@v4
        with:
          name: switchboard-etags-steer
          path: steer/etags.json
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  # 11-13: a sweep (a dispatch or the 15-minute schedule) and a needs:orchestrator label start the reviews' own run
  # (part=ask) on trunk, which runs beside the sweep in its own concurrency group. Only this direction: a reviews run
  # starts nothing, so they never loop. A review it posts is a new comment on the PR, so the next sweep reads that PR
  # (sweep_delta) and merges it. A verdict comment no longer starts reviews (the next sweep's do, within 10 min): a
  # burst of them would fill the newest dispatched runs with reviews runs, and the bridge's watchdog
  # (muse_bridge.gs sweeps_, the newest 5) and switch.py bridge_version_health (the newest 20) read that list for
  # sweeps. No secret, no environment, no checkout; the token's one use is the dispatch. The label's issue number
  # goes on only through env, digits only. A refused dispatch fails the run (the reviews would stop silently),
  # except GitHub's rate limit, which is a warning: the next sweep starts the reviews again.
  wake-ask:
    if: >-
      github.ref == 'refs/heads/ScraperX-Claude' && inputs.part != 'ask' && !inputs.digest && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '3,18,33,48 * * * *') ||
      (github.event_name == 'issues' && github.event.label.name == 'needs:orchestrator'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write   # the dispatch of this workflow, and nothing else
    steps:
      - name: Start the reviews' own run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number }}
          DRY: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          set -uo pipefail
          args=(-f part=ask -f dry_run="$DRY")
          if [ "$EVENT" = issues ] && [[ "$NUMBER" =~ ^[0-9]+$ ]]; then args+=(-f issue="$NUMBER"); fi
          for try in 1 2 3; do
            if err=$(gh workflow run switchboard.yml --repo "$REPO" --ref "$TRUNK" "${args[@]}" 2>&1 >/dev/null); then
              exit 0
            fi
            sleep $((try * 10))
          done
          if grep -qiE 'rate limit|HTTP 429' <<< "$err"; then
            echo "::warning::GitHub's rate limit refused the reviews' run; the next sweep starts it"
            exit 0
          fi
          echo "::error::the reviews' run was not started (3 tries): no review is posted until this is fixed"
          exit 1

  # The paid part: the automatic Claude review, the eye, the orchestrator (off in v0). The only job
  # holding ANTHROPIC_API_KEY. Its code never merges; contents: write is for the ledger branch.
  # 11-13: only in a reviews run (part=ask), which wake-ask starts; never in a sweep's run.
  ask:
    # J-056: it signs the automatic reviews with SWITCHBOARD_REVIEW_KEY, which lives only in this environment
    # (deploys only from ScraperX-Claude), so no branch's copy of any workflow can sign a forged security pass.
    environment: switchboard-merge
    needs: cache-in
    # always(): a cache-in that failed is a cold cache, never a skipped ask
    if: always() && needs.cache-in.result != 'cancelled' && github.event_name == 'workflow_dispatch' && inputs.part == 'ask'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write        # appends work/archive/runs.log on the switchboard/ledger branch
      issues: write          # verdict and note comments
      pull-requests: write   # comments on PRs
      actions: read          # proof runs and the screenshot artifact
    steps:
      - name: Check out trunk
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --branch "$TRUNK" --single-branch "https://github.com/${REPO}.git" src
      - name: Install the hash-pinned dependencies (wheels only)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r src/tools/switchboard/requirements.txt
      - name: Fetch the signed ETag file from cache-in (J-072)
        # this run's artifact, into $RUNNER_TEMP: outside the workspace and the venv, so nothing in it is ever
        # loaded as code; switch.py reads the one file only once its MAC checks. None on a cold start: a cold cache.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: switchboard-etags-ask
          path: ${{ runner.temp }}/etags
      - name: Run the switch
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          # J-056: signs each automatic review (an HMAC); switch.py takes it out of the environment at start.
          SWITCHBOARD_REVIEW_KEY: ${{ secrets.SWITCHBOARD_REVIEW_KEY }}
          SWITCHBOARD_ETAG_CACHE: ${{ runner.temp }}/etags/etags.json   # J-072: from cache-in; MAC-checked
          PART: ${{ github.job }}
          REPO: ${{ github.repository }}
          DISPATCH_DRY: ${{ inputs.dry_run }}
          ASK_ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          # 11-13: always a dispatch from wake-ask; the job issue that woke it, digits only, else a whole pass
          args=(--part "$PART" --repo "$REPO" --root src)
          if [[ "$ASK_ISSUE" =~ ^[0-9]+$ ]]; then args+=(--issue "$ASK_ISSUE" --label needs:orchestrator); fi
          if [ "$DISPATCH_DRY" != "false" ]; then args+=(--dry-run); fi
          .venv/bin/python src/tools/switchboard/switch.py "${args[@]}"
      - name: Hand the signed ETag file to cache-out (J-072)
        # never from a dry run: it must not consume or advance the sweep state (switch.py saves no file then either)
        if: always() && inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: switchboard-etags-ask-out
          path: ${{ runner.temp }}/etags/etags.json
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  # One-time setup of the hosted API agent (step C): only on a dispatch with provision=true. It prints
  # the new ids to the run summary for work/budget.yml; it never prints a secret.
  provision:
    # J-057: ANTHROPIC_API_KEY and AGENT_GITHUB_TOKEN live only in this environment (deploys only from ScraperX-Claude),
    # like the merge token, so no branch's copy of any workflow can read them.
    environment: switchboard-merge
    if: github.event_name == 'workflow_dispatch' && inputs.provision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trunk
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --branch "$TRUNK" --single-branch "https://github.com/${REPO}.git" src
      - name: Install the hash-pinned dependencies (wheels only)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r src/tools/switchboard/requirements.txt
      - name: Create the environment, agent and vault
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          .venv/bin/python src/tools/switchboard/provision_agent.py

  # The free part: the merge rule, review asks, one owner per issue, the digest. No API key.
  steer:
    # 11-13: no longer after ask (the reviews run in their own run), so a merge never waits behind a review
    needs: cache-in
    # J-056 security pass: SWITCHBOARD_MERGE_TOKEN lives only in this environment, which deploys only from
    # ScraperX-Claude, so a branch's copy of this file (a push, or a dispatch on another ref) cannot read it.
    environment: switchboard-merge
    if: >-
      always() && github.event_name != 'push' && inputs.part != 'ask' && needs.cache-in.result != 'cancelled' && (
        github.event_name != 'issues' || startsWith(github.event.label.name, 'owner:')
      ) && (
        github.event_name != 'issue_comment' || (github.event.issue.pull_request &&
          (contains(github.event.comment.body, ': LAND') || contains(github.event.comment.body, ': FIX') ||
           contains(github.event.comment.body, ': NOTE') || contains(github.event.comment.body, ': BLOCK') ||
           contains(github.event.comment.body, 'codex-review-receipt')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # the merge
      issues: write          # labels, notes, the Digest issue
      pull-requests: write   # the merge and PR comments
      actions: write         # dispatch the trunk proof after a merge (a token merge starts no push run)
    steps:
      - name: Check out trunk
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --branch "$TRUNK" --single-branch "https://github.com/${REPO}.git" src
      - name: Install the hash-pinned dependencies (wheels only)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r src/tools/switchboard/requirements.txt
      - name: Fetch the signed ETag file from cache-in (J-072)
        # as in ask: this run's artifact, into $RUNNER_TEMP, read only once its MAC checks
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: switchboard-etags-steer
          path: ${{ runner.temp }}/etags
      - name: Run the switch
        env:
          GH_TOKEN: ${{ github.token }}
          # J-056: a fine-grained PAT (Contents, Pull requests, Workflows: read/write) that merges a PR changing
          # .github/workflows, which github.token cannot. This step and no other: it runs trunk's switch.py only,
          # never PR-head code (the rule check reads the PR's diff; nothing checks it out). switch.py takes it out
          # of the environment at start, so no child process inherits it.
          # J-072: its one other use is switch.py codex_mention: the fixed comment "@codex review" on a green PR of
          # this repo's own branch, once per head (the Codex app ignores this workflow's own login). SECURITY.md.
          SWITCHBOARD_MERGE_TOKEN: ${{ secrets.SWITCHBOARD_MERGE_TOKEN }}
          # J-056: checks the MAC of the security pass before the merge token is used; taken out the same way.
          SWITCHBOARD_REVIEW_KEY: ${{ secrets.SWITCHBOARD_REVIEW_KEY }}
          # J-072: optional Healthchecks.io ping URL, pinged once at the end of a full non-dry sweep (/fail when
          # any part errored); switch.py takes it out of the environment at start. Unset: no ping.
          HC_SWEEP_URL: ${{ secrets.HC_SWEEP_URL }}
          SWITCHBOARD_ETAG_CACHE: ${{ runner.temp }}/etags/etags.json   # J-072: from cache-in; MAC-checked
          PART: ${{ github.job }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
          DISPATCH_DRY: ${{ inputs.dry_run }}
          DISPATCH_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          args=(--part "$PART" --repo "$REPO" --root src)
          case "$EVENT" in
            issue_comment) args+=(--pr "$ISSUE_NUMBER") ;;
            issues) args+=(--issue "$ISSUE_NUMBER" --label "$LABEL") ;;
            schedule) if [ "$SCHEDULE" = "0 12,13 * * *" ]; then args+=(--digest); fi ;;
            workflow_dispatch)
              if [ "$DISPATCH_DIGEST" = "true" ]; then args+=(--force-digest); fi
              if [ "$DISPATCH_DRY" != "false" ]; then args+=(--dry-run); fi ;;
          esac
          .venv/bin/python src/tools/switchboard/switch.py "${args[@]}"
      - name: Hand the signed ETag file to cache-out (J-072)
        # never from a dry run, as in ask
        if: always() && inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: switchboard-etags-steer-out
          path: ${{ runner.temp }}/etags/etags.json
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  # J-072: the other half of cache-in. Saves the files ask and steer handed on, in a job with no secret, no checkout
  # and no code of its own; actions: write is for deleting older cache entries and this run's hand-over artifacts.
  cache-out:
    needs: [cache-in, ask, steer]
    if: always() && needs.cache-in.result == 'success' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Fetch the ask part's file
        uses: actions/download-artifact@v4
        continue-on-error: true   # none when ask did not run or saved nothing
        with:
          name: switchboard-etags-ask-out
          path: ask
      - name: Save the ask part's ETag cache
        if: hashFiles('ask/etags.json') != ''
        uses: actions/cache/save@v4
        with:
          path: ask/etags.json
          key: switchboard-etags-ask-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fetch the steer part's file
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: switchboard-etags-steer-out
          path: steer
      - name: Save the steer part's ETag cache
        if: hashFiles('steer/etags.json') != ''
        uses: actions/cache/save@v4
        with:
          path: steer/etags.json
          key: switchboard-etags-steer-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prune the older ETag caches and this run's hand-over artifacts
        # One entry a run per part (about 300 a day, each up to ~11 MB compressed) would fill the repo's 10 GB
        # Actions cache and evict other workflows' caches. Keep each part's 3 newest; delete the rest. The
        # artifacts only carry the file between this run's jobs (each is kept a day at most anyway).
        # 11-13: best effort, never a failed run. A listing GitHub refuses (its rate limit: the repo's token ran out
        # at 14:02) printed its error JSON into the loop, whose lines were read as ids, and pipefail failed the run,
        # so every sweep mailed "Run failed". Now a refused listing is skipped with a warning (the next run prunes),
        # and only an all-digit id is ever deleted.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PART: ${{ inputs.part == 'ask' && 'ask' || 'steer' }}   # this run's own part's caches only
        run: |
          set -uo pipefail
          exec 3>&1   # the step's own output: a warning from inside a $(...) still reaches the log
          ids() {   # the listing's ids, or nothing and a warning: never the text of a refusal
            local out
            if out=$(gh api "$1" --jq "$2" 2>/dev/null); then printf '%s\n' "$out"
            else echo "::warning::$3 not listed (GitHub refused the read); the next run prunes them" >&3; fi
          }
          drop() {
            [[ "$2" =~ ^[0-9]+$ ]] || return 0
            gh api -X DELETE "repos/$REPO/actions/$1/$2" > /dev/null 2>&1 || echo "::warning::$1 $2 not deleted"
          }
          for part in "$PART"; do
            for id in $(ids "repos/$REPO/actions/caches?key=switchboard-etags-$part-&sort=created_at&direction=desc&per_page=100" \
                '.actions_caches[3:][].id' "the older $part caches" | grep -E '^[0-9]+$'); do
              drop caches "$id"
            done
          done
          for id in $(ids "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              '.artifacts[] | select(.name | startswith("switchboard-etags-")) | .id' "this run's hand-over artifacts" \
              | grep -E '^[0-9]+$'); do
            drop artifacts "$id"
          done
          exit 0

