name: Regenerate ChatGPT world solids

on:
  push:
    branches: [ChatGPT]
    paths:
      - ".github/solid-regeneration/**"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Install Godot runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6
      - name: Install verified Godot 4.7 editor
        shell: bash
        env:
          GODOT_VERSION: 4.7-stable
          GODOT_BINARY_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
        run: |
          set -euo pipefail
          mkdir -p tools/godot
          curl --fail --location --retry 3 \
            --output tools/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_BINARY_SHA256}  tools/godot/godot.zip" | sha256sum --check
          unzip -q tools/godot/godot.zip -d tools/godot
          mv "tools/godot/Godot_v${GODOT_VERSION}_linux.x86_64" tools/godot/godot
          chmod +x tools/godot/godot
          tools/godot/godot --version
      - name: Regenerate authoritative normal and regression collision tables
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s tools/godot/godot --headless --path godot \
            -- "--export-solids=${GITHUB_WORKSPACE}/src/sim/world_solids.inc"
          timeout 300s tools/godot/godot --headless --path godot \
            -- --regression-fixtures \
            "--export-solids=${GITHUB_WORKSPACE}/tests/fixtures/world_solids.inc"
          git diff --check
          git diff --stat
          if git diff --quiet -- src/sim/world_solids.inc tests/fixtures/world_solids.inc; then
            echo "::error::world-solid tables did not change despite fallback-scene removal"
            exit 1
          fi
      - name: Publish generated tables
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT collision regeneration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sim/world_solids.inc tests/fixtures/world_solids.inc
          git commit -m "Regenerate collision tables after fallback removal"
          git push origin HEAD:ChatGPT
