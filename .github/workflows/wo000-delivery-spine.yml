name: ScraperX — full proof path (kernel + ascent)

on:
  push:
    # ChatGPT is the sole write/implementation branch for this line.
    branches: [ChatGPT]
  workflow_dispatch:

permissions:
  contents: read

# Every commit is an immutable build candidate. A newer push must never cancel an
# older commit's build, otherwise that commit can lose its APK. "Build candidate",
# not "checkpoint": a checkpoint in ScraperX is the in-sim commit_checkpoint(), and
# the word is not reused for CI artefacts.
concurrency:
  group: scraperx-checkpoint-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7-stable
  GODOT_BINARY_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  GODOT_TEMPLATES_SHA256: 9714459dc071907c0f3d5f17d608faf69e7cda21331fc5d39c4503ffa4e99eec
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_VERSION: 29.0.14206865
  # Public CI-only debug signer. This key exists solely so successive ChatGPT
  # test APKs have one Android signer and can update in place on the Fold.
  GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/ci/android/ScraperX-ChatGPT-debug.keystore
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
  CHATGPT_SIGNER_SHA256: 9a06889e7614d140f6cd1fc45634bb1e2391968a9fcc60f1608c9e50e15a1ba4

jobs:
  moving-support-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build and render prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ninja-build xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6
          SDKMANAGER_PATH="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "${SDKMANAGER_PATH}"
          yes | "${SDKMANAGER_PATH}" --licenses >/dev/null || true
          "${SDKMANAGER_PATH}" "platform-tools" "build-tools;36.1.0" "platforms;android-36" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install verified Godot 4.7 editor and Android template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/godot "${HOME}/.local/share/godot/export_templates/4.7.stable"
          curl --fail --location --retry 3 \
            --output tools/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_BINARY_SHA256}  tools/godot/godot.zip" | sha256sum --check
          unzip -q tools/godot/godot.zip -d tools/godot
          mv "tools/godot/Godot_v${GODOT_VERSION}_linux.x86_64" tools/godot/godot
          chmod +x tools/godot/godot

          curl --fail --location --retry 3 \
            --output tools/godot/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  tools/godot/templates.tpz" | sha256sum --check
          unzip -q -j tools/godot/templates.tpz templates/android_debug.apk \
            -d "${HOME}/.local/share/godot/export_templates/4.7.stable"
          tools/godot/godot --version

      - name: Build native host graph and run the full native suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cmake -S . -B build/host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSCRAPERX_BUILD_BRIDGE=ON \
            -DSCRAPERX_WITH_JOLT=ON \
            -DGODOTCPP_TARGET=template_release
          cmake --build build/host --target scraperx_west_brace_bay_route_tests scraperx_taper_inspection_route_tests scraperx_gravity_cart_integration_tests scraperx_mechanism_hull_tests scraperx_gravity_reclaim_route_tests scraperx_supplied_machine_route_tests scraperx_service_lift_physics_tests scraperx_service_lift_route_tests scraperx_physical_hand_climb_tests scraperx_physical_traversal_tests scraperx_leather_pouch_tests scraperx_suspended_ladder_tests scraperx_cargo_net_tests scraperx_sim_tests scraperx_slingshot_model_tests scraperx_slingshot_machine_tests scraperx_launcher_tests scraperx_landing_tests scraperx_ascent_route_tests scraperx_swing_stair_route_tests scraperx_parkour_flow_tests scraperx_pipe_bridge_tests scraperx_pipe_bridge_refinement scraperx_teeter_route_tests scraperx_teeter_physics_tests scraperx_braced_bay_tests scraperx_north_service_frame_tests scraperx_native --parallel 2
          if ! ctest --test-dir build/host --output-on-failure --test-output-size-passed 2147483647 \
              --output-junit "${GITHUB_WORKSPACE}/artifacts/native-tests.xml" | tee artifacts/native-tests.log; then
            # The public run page exposes annotations even when its raw logs
            # are unavailable. Keep the exact failing test and nearby output.
            python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path('artifacts/native-tests.log').read_text().splitlines()
          failures = [i for i, line in enumerate(lines) if '***Failed' in line or '***Timeout' in line]
          for index in failures[:4]:
              end = next((i for i in range(index + 1, len(lines))
                          if re.match(r'^\s*Start\s+\d+:', lines[i])), len(lines))
              message = '\n'.join(lines[max(0, index - 1):index + 1] + lines[max(index + 1, end - 16):end])
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Native test failure::{escaped}')
          if not failures:
              tail = '\n'.join(lines[-15:])
              escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Native test gate failure::{escaped}')
          PY
            exit 1
          fi
          grep -F "100% tests passed" artifacts/native-tests.log
          # Preserve each proof's original artifact path using captured output
          # from its one CTest execution, including all three north-frame rates.
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse('artifacts/native-tests.xml').getroot()
          cases = {}
          for case in root.iter('testcase'):
              name = case.attrib['name']
              if name in cases:
                  raise SystemExit(f'Duplicate CTest result: {name}')
              cases[name] = case
          logs = {
              'taper-inspection-native.log': ['taper_inspection_route'],
              'parkour-flow.log': ['parkour_flow'],
              'native-falsifiers.log': ['athletic_traversal'],
              'pipe-bridge-native.log': ['pipe_bridge_route'],
              'ascent-route.log': ['ascent_route'],
              'teeter-native.log': ['teeter_route'],
              'teeter-physics.log': ['teeter_physics'],
              'braced-bay-native.log': ['braced_bay'],
              'north-service-frame-native.log': [
                  'north_service_frame', 'north_service_frame_60hz', 'north_service_frame_360hz'],
          }
          for filename, names in logs.items():
              outputs = []
              for suffix in names:
                  name = 'scraperx_sim.' + suffix
                  case = cases.get(name)
                  if case is None or case.attrib.get('status') != 'run' or any(
                          case.find(tag) is not None for tag in ('failure', 'error', 'skipped')):
                      raise SystemExit(f'Missing or unsuccessful CTest result: {name}')
                  output = case.findtext('system-out', '')
                  if not output.strip():
                      raise SystemExit(f'Missing CTest proof output: {name}')
                  outputs.append(output.rstrip('\n') + '\n')
              Path('artifacts', filename).write_text(''.join(outputs))
          PYTHON
          grep -F "PASS scraperx_sim parkour flow" artifacts/parkour-flow.log
          grep -F "PASS TAPER_INSPECTION primary352_to_existing374.25 ordinary_inputs=1" artifacts/taper-inspection-native.log
          grep -F "PASS TAPER_INSPECTION middle_miss_apron_crouched_service_rejoin" artifacts/taper-inspection-native.log
          grep -F "PASS TAPER_INSPECTION upper_miss_catch_tongue_rejoin" artifacts/taper-inspection-native.log
          for proof in \
            "PASS scraperx_sim moving-support truth" \
            "PASS scraperx_sim athletic traversal" \
            "PASS scraperx_sim first full causal chain" \
            "PASS scraperx_sim coupled machine" \
            "PASS scraperx_sim fall/parachute/checkpoint" \
            "PASS scraperx_sim first freight" \
            "PASS scraperx_sim first structural coupling" \
            "PASS scraperx_sim first process coupling" \
            "PASS scraperx_sim B00 intake rise" \
            "PASS scraperx_sim AS-002 Legal Forty" \
            "PASS scraperx_sim world solids" \
            "PASS scraperx_sim crouch" \
            "PASS scraperx_sim AS-003 apron" \
            "PASS scraperx_sim AS-003 cage" \
            "PASS scraperx_sim AS-003 Hook5 Rack" \
            "PASS scraperx_sim ground water screw" \
            "PASS scraperx_sim ground water lift" \
            "PASS scraperx_sim continuous ground screw ascent" \
            "PASS scraperx_sim AS-006 A no link" \
            "PASS scraperx_sim AS-006 A ride" \
            "PASS scraperx_sim AS-006 B no link" \
            "PASS scraperx_sim AS-006 B ride"
          do
            grep -F "${proof}" artifacts/native-falsifiers.log
          done
          # AS-001 B00: the intake rise closed, and it closed for physical
          # reasons. Each of these is a separate link in the causal path.
          grep -F "pinned_impassable=1" artifacts/native-falsifiers.log
          grep -F "forced_impassable=1" artifacts/native-falsifiers.log
          grep -F "skin_freight_untouched=1" artifacts/native-falsifiers.log
          awk -F'skin_mantles=' '/B00 intake rise/ {split($2,a," "); exit (a[1]+0 >= 15) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'handoff_y=' '/B00 intake rise/ {split($2,a," "); exit (a[1]+0 > 24.8) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'overweight_y=' '/B00 intake rise/ {split($2,a," "); exit (a[1]+0 < 1.2) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          # AS-002 Legal Forty: the counterweighted bascule deployed under
          # the real 4 t pack, carried the ascent to +40 m and committed a
          # checkpoint there, relaxed back on its own once unloaded, SKIN's
          # bypass reached the same +40 m without ever touching the hinge,
          # and the rated jib still cannot reach that height. Each is a
          # separate link in the causal path, same as B00's own above.
          awk -F'deployed_travel=' '/AS-002 Legal Forty/ {split($2,a," "); exit (a[1]+0 >= 0.85) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'cradle_drop=' '/AS-002 Legal Forty/ {split($2,a," "); exit (a[1]+0 >= 1.40) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'forty_y=' '/AS-002 Legal Forty/ {split($2,a," "); exit (a[1]+0 >= 40.88) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'checkpoint_y=' '/AS-002 Legal Forty/ {split($2,a," "); exit (a[1]+0 >= 40.0) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'retracted_travel=' '/AS-002 Legal Forty/ {split($2,a," "); exit (a[1]+0 <= 0.20) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'skin_forty_mantles=' '/AS-002 Legal Forty/ {split($2,a," "); exit (a[1]+0 >= 20) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'skin_forty_y=' '/AS-002 Legal Forty/ {split($2,a," "); exit (a[1]+0 >= 40.88) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'jib_capped_hook_y=' '/AS-002 Legal Forty/ {split($2,a," "); exit (a[1]+0 < 12.0) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          # AS-003 Hook5 Rack: the cage's lock is height -- grade never rises
          # past a plain jump -- the seated bar held the door against every
          # command and freeing it let the door travel on its own drive, the
          # block rode the hands within 1 m and was picked up again off the
          # ground, the hands-free SKIN climb ran its 15 mantles, the belt
          # put the body on the roof within two strokes, the block reached
          # +40 m held, and a lethal fall restored it in hand on the deck.
          awk -F'grade_peak_y=' '/AS-003 apron/ {split($2,a," "); exit (a[1]+0 < 3.2) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'mashed_door=' '/AS-003 cage/ {split($2,a," "); exit (a[1]+0 <= 0.05) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'travelled_door=' '/AS-003 cage/ {split($2,a," "); exit (a[1]+0 >= 1.20) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'carry_worst_gap=' '/AS-003 cage/ {split($2,a," "); exit (a[1]+0 <= 1.0) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'repicked_y=' '/AS-003 cage/ {split($2,a," "); exit (a[1]+0 > 0.8) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'skin_mantles=' '/AS-003 cage/ {split($2,a," "); exit (a[1]+0 >= 15) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'ride_s=' '/AS-003 Hook5 Rack/ {split($2,a," "); exit (a[1]+0 <= 32.0) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'roof_y=' '/AS-003 Hook5 Rack/ {split($2,a," "); exit (a[1]+0 >= 5.15) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'forty_y=' '/AS-003 Hook5 Rack/ {split($2,a," "); exit (a[1]+0 >= 40.88) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'restored_y=' '/AS-003 Hook5 Rack/ {split($2,a," "); exit (a[1]+0 >= 40.88) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          grep -F "restored_carry=56" artifacts/native-falsifiers.log
          # Retired regression fixture ONLY; not shipped campaign progress.
          # Ground screw: finite drive raises the conserved water mass required
          # by the receiving +8 m lift; rival shortcut conditions must fail.
          awk -F'tank_m3=' '/ground water screw/ {split($2,a," "); exit (a[1]+0 >= 1.999) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'peak_rpm=' '/ground water screw/ {split($2,a," "); exit (a[1]+0 <= 22.05) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'peak_torque_nm=' '/ground water screw/ {split($2,a," "); exit (a[1]+0 <= 1500.01) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'shaft_work_J=' '/ground water screw/ {split($2,a," "); exit (a[1]+0 >= 196200) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          grep -F "full_stop=1 reverse_return=1" artifacts/native-falsifiers.log
          # Ground water lift: the upstream 2.0 m3 is a real mass input to a
          # 2:1 pulley, not a completion flag. Wrong mass, no rope, or held
          # catch cannot produce ascent; the rider reaches a fixed +8 m dock
          # and the water returns to the basin before reset.
          awk -F'cage_travel=' '/PASS scraperx_sim ground water lift:/ {split($2,a," "); exit (a[1]+0 >= 7.90) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'peak_speed=' '/PASS scraperx_sim ground water lift:/ {split($2,a," "); exit (a[1]+0 <= 2.35) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'dock_y=' '/PASS scraperx_sim ground water lift:/ {split($2,a," "); exit (a[1]+0 >= 8.9) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'conserved_err=' '/PASS scraperx_sim ground water lift:/ {split($2,a," "); exit (a[1]+0 <= 1e-8) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          grep -F "dry_fail=1 partial_fail=1 rope_fail=1 overload_fail=1 moving_support=1 reset=1" \
            artifacts/native-falsifiers.log
          # One unseeded player run starts the screw, walks to the valve,
          # fills and rides the cage, and finishes on the fixed +8 m dock.
          awk -F'dock_y=' '/continuous ground screw ascent/ {split($2,a," "); exit (a[1]+0 >= 8.9) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'cage_travel=' '/continuous ground screw ascent/ {split($2,a," "); exit (a[1]+0 >= 7.90) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'conserved_err=' '/continuous ground screw ascent/ {split($2,a," "); exit (a[1]+0 <= 1e-8) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          grep -F "moving_support=1 no_seed=1" artifacts/native-falsifiers.log
          # AS-006 Stage A, the skip lift: no link, no lift (the cage never
          # moves while the rope is on the bollard, and the stage re-rigs);
          # linked, the rider rides 22 m to 176.25 under a brake-only
          # governor, and the payload never out-earns the skip.
          awk -F'cage_worst=' '/AS-006 A no link/ {split($2,a," "); exit (a[1]+0 <= 0.05) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          grep -F "relatched=1 rerigged=1" artifacts/native-falsifiers.log
          awk -F'floor_y=' '/AS-006 A ride/ {split($2,a," "); exit (a[1]+0 >= 176.20 && a[1]+0 <= 176.30) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'peak_speed=' '/AS-006 A ride/ {split($2,a," "); exit (a[1]+0 <= 2.6) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          grep -F "rode_on_cage=1" artifacts/native-falsifiers.log
          awk -F'restored_y=' '/AS-006 A ride/ {split($2,a," "); exit (a[1]+0 >= 177.0) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          # AS-006 Stage B: the 2.5 t lattice cannot spend its stored height
          # while the rope is still on the bollard; once re-rigged it raises
          # the adjacent cage to 198.25 m and itself finishes as a 22 m
          # physical lattice spanning 176.25..198.25.
          awk -F'cage_worst=' '/AS-006 B no link/ {split($2,a," "); exit (a[1]+0 <= 0.05) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'lattice_drop=' '/AS-006 B no link/ {split($2,a," "); exit (a[1]+0 <= 0.05) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'floor_y=' '/AS-006 B ride/ {split($2,a," "); exit (a[1]+0 >= 198.20 && a[1]+0 <= 198.30) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'peak_speed=' '/AS-006 B ride/ {split($2,a," "); exit (a[1]+0 <= 3.1) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'lattice_top_y=' '/AS-006 B ride/ {split($2,a," "); exit (a[1]+0 >= 198.20 && a[1]+0 <= 198.30) ? 0 : 1}' \
            artifacts/native-falsifiers.log

      - name: Import presentation resources
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s tools/godot/godot --headless --editor --import --path godot \
            2>&1 | tee artifacts/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/godot-import.log; then exit 1; fi

      - name: Prove interpolated parkour camera and motion comfort
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/.godot
          printf '%s\n' 'res://addons/scraperx_native/scraperx_native.gdextension' \
            > godot/.godot/extension_list.cfg
          timeout 180s tools/godot/godot --headless --path godot \
            --script res://tests/parkour_camera_test.gd 2>&1 | tee artifacts/parkour-camera.log
          grep -F "SCRAPERX_PARKOUR_CAMERA PASS" artifacts/parkour-camera.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/parkour-camera.log; then exit 1; fi

      - name: Prove manual slingshot, character, settings and touch input
        shell: bash
        run: |
          set -euo pipefail
          for proof in touch_capture slingshot_view climber_character settings_runtime landing_camera footstep_contact; do
            timeout 180s tools/godot/godot --headless --fixed-fps 90 --path godot \
              --script "res://tests/${proof}_test.gd" 2>&1 | tee "artifacts/${proof}.log"
            if grep -E "SCRIPT ERROR|Parse Error|FAIL" "artifacts/${proof}.log"; then exit 1; fi
          done
          grep -F "SCRAPERX_SETTINGS_RUNTIME checks=" artifacts/settings_runtime.log
          for scenario in touch_slingshot touch_slingshot_landing touch_cargo_net touch_suspended_ladder; do
            timeout 180s tools/godot/godot --headless --fixed-fps 60 --path godot \
              -- "--uitest=${scenario}" 2>&1 | tee "artifacts/${scenario}.log"
            grep -F "SCRAPERX_UITEST PASS ${scenario} " "artifacts/${scenario}.log"
            if grep -E "SCRIPT ERROR|Parse Error" "artifacts/${scenario}.log"; then exit 1; fi
          done
          mkdir -p artifacts/screenshots
          timeout 600s xvfb-run -a -s "-screen 0 1296x1114x24" \
            tools/godot/godot --path godot --rendering-method gl_compatibility \
            --script res://tests/slingshot_visual_probe.gd \
            -- --sling-probe-motion --sling-probe-size=864x742 \
            "--sling-probe-out=${GITHUB_WORKSPACE}/artifacts/screenshots/slingshot" \
            2>&1 | tee artifacts/slingshot-visual.log
          grep -F "SCRAPERX_SLINGSHOT_VISUAL_PROBE PASS" artifacts/slingshot-visual.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/slingshot-visual.log; then exit 1; fi
          test -s artifacts/screenshots/slingshot/launch-motion.csv
          timeout 300s xvfb-run -a -s "-screen 0 432x371x24" \
            tools/godot/godot --path godot --rendering-method gl_compatibility \
            --fixed-fps 30 --audio-driver Dummy \
            --write-movie "${RUNNER_TEMP}/slingshot-audio.avi" \
            --script res://tests/slingshot_audio_test.gd \
            2>&1 | tee artifacts/slingshot-audio.log
          grep -F "SCRAPERX_SLINGSHOT_AUDIO PASS" artifacts/slingshot-audio.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/slingshot-audio.log; then exit 1; fi
          rm -f "${RUNNER_TEMP}/slingshot-audio.avi"

      - name: Prove uninterrupted cargo-net and service-lift ascent to 143 metres
        shell: bash
        run: |
          set -euo pipefail
          timeout 600s tools/godot/godot --headless --fixed-fps 60 --path godot \
            -- --uitest=touch_campaign_to_143 2>&1 | tee artifacts/touch-campaign-to-121.log
          grep -F "SCRAPERX_CAMPAIGN supported_height_m=121 support=11 deaths=0 staging=ordinary_grade_spawn" artifacts/touch-campaign-to-121.log
          grep -F "SCRAPERX_UITEST PASS touch_campaign_to_143 staging=ordinary_grade_spawn" artifacts/touch-campaign-to-121.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/touch-campaign-to-121.log; then exit 1; fi

      - name: Prove physical ballast mantle, footing feedback and ordinary touch return
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s tools/godot/godot --headless --fixed-fps 60 --path godot \
            -- --uitest=touch_ballast_mantle_feedback 2>&1 | tee artifacts/touch-ballast-mantle-feedback.log
          grep -F "SCRAPERX_UITEST PASS touch_ballast_mantle_feedback" artifacts/touch-ballast-mantle-feedback.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/touch-ballast-mantle-feedback.log; then exit 1; fi

      - name: Prove loaded slab-haul ascent, missed-exit recovery and paid reset
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s tools/godot/godot --headless --fixed-fps 60 --path godot \
            -- --uitest=touch_slab_haul_cart 2>&1 | tee artifacts/touch-slab-haul-cart.log
          grep -F "SCRAPERX_UITEST PASS touch_slab_haul_cart" artifacts/touch-slab-haul-cart.log
          grep -F "failure_recovery=upper_miss341_paid_recall_reboard_retry" artifacts/touch-slab-haul-cart.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/touch-slab-haul-cart.log; then exit 1; fi

      - name: Prove first-taper touch ascent and crouched missed-gap recovery
        shell: bash
        run: |
          set -euo pipefail
          timeout 360s tools/godot/godot --headless --fixed-fps 60 --path godot \
            -- --uitest=touch_taper_inspection_route 2>&1 | tee artifacts/touch-taper-inspection-route.log
          grep -F "SCRAPERX_UITEST PASS touch_taper_inspection_route" artifacts/touch-taper-inspection-route.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/touch-taper-inspection-route.log; then exit 1; fi

      - name: Prove west-brace normal touch ascent to 396 metres
        shell: bash
        run: |
          set -euo pipefail
          timeout 360s tools/godot/godot --headless --fixed-fps 60 --path godot \
            -- --uitest=touch_west_brace_bay 2>&1 | tee artifacts/touch-west-brace-bay.log
          grep -F "SCRAPERX_UITEST PASS touch_west_brace_bay" artifacts/touch-west-brace-bay.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/touch-west-brace-bay.log; then exit 1; fi

      - name: Prove default inventory and rejected fallback absence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "PASS scraperx_sim ground foundation: retired_bodies=0 moving_bodies=164 kit_bodies=215 locomotion=1 crouch=1 jump=1" artifacts/native-falsifiers.log
          grep -F "PASS scraperx_sim rejected fallback absent: tower_bodies=385" artifacts/native-falsifiers.log
          grep -F "PASS scraperx_sim oblique close pull-up: ledge=6 mantle=1" artifacts/native-falsifiers.log
          grep -F "PASS scraperx_sim default checkpoint: death_restore=1 retired_respawn=0" artifacts/native-falsifiers.log
          mkdir -p artifacts/screenshots godot/.godot
          printf '%s\n' 'res://addons/scraperx_native/scraperx_native.gdextension' \
            > godot/.godot/extension_list.cfg
          timeout 300s xvfb-run -a -s "-screen 0 1728x1485x24" \
