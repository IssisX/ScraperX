            -- --uitest=ground_foundation "--capture=${GITHUB_WORKSPACE}/artifacts/screenshots/foundation" \
            2>&1 | tee artifacts/godot-foundation.log
          grep -F "SCRAPERX_UITEST PASS ground_foundation retired_bodies=0 moving_bodies=164 kit_bodies=215 cables=7 retired_meshes=0 rejected_fallback_meshes=0 default_controls=1" artifacts/godot-foundation.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/godot-foundation.log; then exit 1; fi

      - name: Historical pipe bridge fixture - ordinary input and native material state
        shell: bash
        run: |
          set -euo pipefail
          grep -F "PASS scraperx_sim AS-016 route mode=0" artifacts/pipe-bridge-native.log
          for scenario in pipe_bridge keyboard_pipe_bridge; do
            timeout 240s tools/godot/godot --headless --fixed-fps 60 --path godot \
              -- "--uitest=${scenario}" 2>&1 | tee "artifacts/${scenario}.log"
            grep -F "SCRAPERX_UITEST PASS ${scenario} " "artifacts/${scenario}.log"
          done
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/*pipe_bridge.log; then exit 1; fi

      - name: Historical opening fixture and retained upper route - rendered touch to 110 metres
        shell: bash
        run: |
          set -euo pipefail
          grep -F "PASS scraperx_sim AS-020 loaded teeter, recovery and +77 route" artifacts/teeter-native.log
          # This calls the complete touch pipe, facade and stair route first.
          # --resolution changes the window, not the project's 2160x1856
          # canvas viewport. Reduce both for this CPU-rendered route only;
          # restore the shipped Fold project settings before later gates/export.
          facade_project_backup="$(mktemp)"
          cp godot/project.godot "$facade_project_backup"
          restore_facade_project() {
            cp "$facade_project_backup" godot/project.godot
            rm -f "$facade_project_backup"
          }
          trap restore_facade_project EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('godot/project.godot')
          text = path.read_text()
          replacements = {
              'window/size/viewport_width=2160': 'window/size/viewport_width=432',
              'window/size/viewport_height=1856': 'window/size/viewport_height=371',
              'window/size/window_width_override=1296': 'window/size/window_width_override=432',
              'window/size/window_height_override=1114': 'window/size/window_height_override=371',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, f'project viewport setting changed: {old}'
              text = text.replace(old, new)
          path.write_text(text)
          PY
          timeout 600s xvfb-run -a -s "-screen 0 432x371x24" \
            tools/godot/godot --path godot --rendering-method gl_compatibility \
            --resolution 432x371 --fixed-fps 60 \
            -- --uitest=touch_slingshot_landing "--capture=${GITHUB_WORKSPACE}/artifacts/screenshots/shipping-launch" \
            2>&1 | tee artifacts/rendered-touch-slingshot-landing.log
          grep -F "SCRAPERX_UITEST PASS touch_slingshot_landing " artifacts/rendered-touch-slingshot-landing.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/rendered-touch-slingshot-landing.log; then exit 1; fi
          timeout 2400s xvfb-run -a -s "-screen 0 432x371x24" \
            tools/godot/godot --path godot --rendering-method gl_compatibility \
            --resolution 432x371 --fixed-fps 30 \
            -- --uitest=touch_north_frame "--capture=${GITHUB_WORKSPACE}/artifacts/screenshots/north" \
            2>&1 | tee artifacts/touch-north-frame.log
          grep -F "SCRAPERX_VIEWPORT size=432x371" artifacts/touch-north-frame.log
          grep -F "SCRAPERX_UITEST PASS touch_north_frame " artifacts/touch-north-frame.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/touch-north-frame.log; then exit 1; fi

      - name: Regression fixture - native machine authority and Fold-aspect capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/screenshots godot/.godot
          printf '%s\n' 'res://addons/scraperx_native/scraperx_native.gdextension' \
            > godot/.godot/extension_list.cfg
          grep -F 'res://addons/scraperx_native/scraperx_native.gdextension' \
            godot/.godot/extension_list.cfg
          timeout 300s xvfb-run -a -s "-screen 0 1728x1485x24" \
            tools/godot/godot --verbose --path godot --rendering-method gl_compatibility --quit-after 2400 \
            -- --ci "--capture=${GITHUB_WORKSPACE}/artifacts/screenshots/wo006-approach-and-machine.png" \
            2>&1 | tee artifacts/godot-runtime.log
          grep -F "SCRAPERX_EXTENSION_LOADED" artifacts/godot-runtime.log
          grep -F "work_order=WO-006" artifacts/godot-runtime.log
          # WO-004: the viewport is the Fold inner panel, not a phone strip.
          grep -F "SCRAPERX_WO004_VIEWPORT_PROOF" artifacts/godot-runtime.log
          grep -F "width=2160 height=1856" artifacts/godot-runtime.log
          grep -F "aspect=1.164" artifacts/godot-runtime.log
          grep -F "stretch=expand" artifacts/godot-runtime.log
          # WO-005: spawn is outdoors at grade with the tower still ahead.
          grep -F "SCRAPERX_WO005_APPROACH_PROOF" artifacts/godot-runtime.log
          grep -F "tower_height=1600" artifacts/godot-runtime.log
          # WO-006: the coupled chain ran, and a shut valve passed exactly zero mass.
          grep -F "SCRAPERX_WO006_MACHINE_PROOF" artifacts/godot-runtime.log
          grep -F "shut_flow=0.00000" artifacts/godot-runtime.log
          awk -F'peak_valve=' '/SCRAPERX_WO006_MACHINE_PROOF/ {split($2,a," "); exit (a[1]+0 > 0.5) ? 0 : 1}' \
            artifacts/godot-runtime.log
          awk -F'peak_lift=' '/SCRAPERX_WO006_MACHINE_PROOF/ {split($2,a," "); exit (a[1]+0 > 6.0) ? 0 : 1}' \
            artifacts/godot-runtime.log

      - name: Regression fixtures - drive controller and mechanism input paths
        shell: bash
        run: |
          set -euo pipefail
          # Each scenario injects touch / gamepad / keyboard events through the
          # viewport's own input pipeline and asserts a native state change
          # (presentation/ui/ui_test_driver.gd). --fixed-fps makes simulated
          # time exact however fast the runner is.
          : > artifacts/godot-uitest.log
          for scenario in touch_jump touch_move_look touch_gyro_aim touch_climb touch_vault touch_double_tap_vault touch_crouch touch_hang_drop \
              touch_hang_climb touch_chute touch_lethal_feedback touch_sump touch_pendant \
              touch_carry touch_water_screw touch_water_lift touch_pause pad_core pad_pendant keyboard_core \
              touch_rig pad_rig keyboard_rig; do
            timeout 180s tools/godot/godot --headless --fixed-fps 60 --path godot \
              -- "--uitest=${scenario}" 2>&1 | tee -a artifacts/godot-uitest.log
            grep -F "SCRAPERX_UITEST PASS ${scenario} " artifacts/godot-uitest.log
          done
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/godot-uitest.log; then exit 1; fi

      - name: Render-native kit and retired mechanism proofs
        shell: bash
        run: |
          set -euo pipefail
          # These are actual Compatibility draws under Xvfb. Headless runs
          # cannot prove that the native snapshot reaches visible geometry.
          timeout 180s xvfb-run -a -s "-screen 0 192x164x24" \
            tools/godot/godot --fixed-fps 60 --path godot --rendering-method gl_compatibility \
            --script res://tests/kit_view_test.gd 2>&1 | tee artifacts/kit-view-normal.log
          grep -F "SCRAPERX_KIT_VIEW PASS" artifacts/kit-view-normal.log
          timeout 180s xvfb-run -a -s "-screen 0 192x164x24" \
            tools/godot/godot --fixed-fps 60 --path godot --rendering-method gl_compatibility \
            --script res://tests/kit_view_test.gd -- --regression-fixtures \
            2>&1 | tee artifacts/kit-view-fixtures.log
          grep -F "SCRAPERX_KIT_VIEW PASS" artifacts/kit-view-fixtures.log
          timeout 300s xvfb-run -a -s "-screen 0 432x371x24" \
            tools/godot/godot --fixed-fps 60 --path godot --rendering-method gl_compatibility \
            --script res://tests/kit_route_render_test.gd -- --kit-route=touch_cargo_net \
            2>&1 | tee artifacts/kit-route-render.log
          grep -F "SCRAPERX_KIT_ROUTE_DRAW pose=cargo_net_climbing" artifacts/kit-route-render.log
          grep -F "SCRAPERX_UITEST PASS touch_cargo_net" artifacts/kit-route-render.log
          timeout 180s xvfb-run -a -s "-screen 0 432x371x24" \
            tools/godot/godot --fixed-fps 60 --path godot --rendering-method gl_compatibility \
            --script res://tests/kit_mechanism_render_test.gd \
            2>&1 | tee artifacts/kit-mechanism-shackle.log
          grep -F "SCRAPERX_KIT_MECHANISM PASS mode=shackle" artifacts/kit-mechanism-shackle.log
          if grep -E "SCRIPT ERROR|Parse Error|KIT_(VIEW|ROUTE_RENDER|MECHANISM) FAIL" \
              artifacts/kit-view-normal.log artifacts/kit-view-fixtures.log \
              artifacts/kit-route-render.log artifacts/kit-mechanism-shackle.log; then exit 1; fi
          # One invocation covers resource validity and all36 recorded takes/
          # phases through the actual controller and limiter.
          timeout 180s xvfb-run -a -s "-screen 0 192x164x24" \
            tools/godot/godot --fixed-fps 30 --path godot --rendering-method gl_compatibility \
            --write-movie "${RUNNER_TEMP}/recorded-footsteps.avi" \
            --script res://tests/recorded_footsteps_test.gd \
            2>&1 | tee artifacts/recorded-footsteps.log
          grep -F "RECORDED_FOOTSTEPS_MIX PASS cases=36" artifacts/recorded-footsteps.log
          if grep -E "SCRIPT ERROR|Parse Error|RECORDED_FOOTSTEPS.*FAIL" \
              artifacts/recorded-footsteps.log; then exit 1; fi

      - name: Measure the mix a player hears
        shell: bash
        run: |
          set -euo pipefail
          # The headless runs above use the Dummy audio driver, which never
          # mixes, so they can only count cues. Movie Maker mixes that same
          # driver frame by frame; audio_mix (ui_test_driver.gd) captures what
          # leaves Master and requires audible ambience and footsteps above
          # 300 Hz, where a phone speaker plays, with no clipping.
          timeout 900s xvfb-run -a -s "-screen 0 1296x1114x24" \
            tools/godot/godot --path godot --rendering-method gl_compatibility --fixed-fps 30 \
            --write-movie "${RUNNER_TEMP}/audio-mix.avi" -- --uitest=audio_mix \
            2>&1 | tee artifacts/godot-audio-mix.log
          rm -f "${RUNNER_TEMP}/audio-mix.avi"
          grep -F "SCRAPERX_UITEST PASS audio_mix " artifacts/godot-audio-mix.log
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/godot-audio-mix.log; then exit 1; fi
          timeout 180s xvfb-run -a tools/godot/godot --path godot --fixed-fps 60 \
            --write-movie "${RUNNER_TEMP}/fall-voices.avi" \
            --script res://presentation/audio/fall_reactions_test.gd \
            2>&1 | tee artifacts/fall-voices.log
          grep -F "SCRAPERX_FALL_VOICE" artifacts/fall-voices.log
          if grep -E "SCRIPT ERROR|Parse Error|FALL_VOICE_FAIL" artifacts/fall-voices.log; then exit 1; fi
          rm -f "${RUNNER_TEMP}/fall-voices.avi"

      - name: World solids table matches the Godot builders
        shell: bash
        run: |
          set -euo pipefail
          # src/sim/world_solids.inc is generated from the presentation's
          # builders (godot/presentation/solid_export.gd). The native suite
          # above ran against the committed table; this proves that table is
          # still exactly what the builders draw.
          timeout 300s tools/godot/godot --headless --path godot \
            -- "--export-solids=${GITHUB_WORKSPACE}/artifacts/world_solids.regenerated.inc" \
            2>&1 | tee artifacts/world-solids-export.log
          grep -F "SCRAPERX_SOLIDS boxes=" artifacts/world-solids-export.log
          diff -u src/sim/world_solids.inc artifacts/world_solids.regenerated.inc
          timeout 300s tools/godot/godot --headless --path godot \
            -- --regression-fixtures "--export-solids=${GITHUB_WORKSPACE}/artifacts/fixture_solids.regenerated.inc" \
            2>&1 | tee artifacts/fixture-solids-export.log
          diff -u tests/fixtures/world_solids.inc artifacts/fixture_solids.regenerated.inc

      - name: Cross-compile native graph for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/android-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DSCRAPERX_BUILD_BRIDGE=ON \
            -DSCRAPERX_WITH_JOLT=ON \
            -DGODOTCPP_TARGET=template_release
          cmake --build build/android-arm64 --target scraperx_native --parallel 2
          test -s godot/addons/scraperx_native/bin/android/arm64/libscraperx_native.so
          file godot/addons/scraperx_native/bin/android/arm64/libscraperx_native.so | tee artifacts/android-native-library.log

      - name: Export ChatGPT Android arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="ScraperX-ChatGPT.apk"
          PACKAGE_ID="com.cory.scraperx.chatgpt"
          APP_LABEL="ScraperX-ChatGPT"

          # Branch-author identity is a delivery contract, not cosmetic metadata.
          # Keep commit provenance in CHECKPOINT.txt while the APK filename and
          # installed app identity stay stable and immediately recognizable.
          grep -F 'config/name="ScraperX-ChatGPT"' godot/project.godot
          grep -F 'export_path="../build/apk/ScraperX-ChatGPT.apk"' godot/export_presets.cfg
          grep -F 'package/unique_name="com.cory.scraperx.chatgpt"' godot/export_presets.cfg
          grep -F 'package/name="ScraperX-ChatGPT"' godot/export_presets.cfg

          # A fresh GitHub runner must not invent a new signing identity. The
          # committed debug-only keystore is the branch authority for test APKs.
          test -s "${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}"
          keytool -list -v \
            -keystore "${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}" \
            -storepass "${GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD}" \
            -alias "${GODOT_ANDROID_KEYSTORE_DEBUG_USER}" \
            | tee artifacts/chatgpt-debug-keystore.txt
          KEYSTORE_SIGNER_SHA256="$(awk '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}' artifacts/chatgpt-debug-keystore.txt)"
          test "${KEYSTORE_SIGNER_SHA256}" = "${CHATGPT_SIGNER_SHA256}"

          mkdir -p build/apk artifacts/apk
          tools/godot/godot --headless --path godot \
            --export-debug "Android arm64" "${GITHUB_WORKSPACE}/build/apk/${APK_NAME}" \
            2>&1 | tee artifacts/godot-android-export.log

          test -s "build/apk/${APK_NAME}"
          mapfile -t produced_apks < <(find build/apk -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort)
          test "${#produced_apks[@]}" -eq 1
          test "${produced_apks[0]}" = "${APK_NAME}"

          unzip -l "build/apk/${APK_NAME}" | tee artifacts/apk-contents.log
          grep -F "lib/arm64-v8a/libscraperx_native.so" artifacts/apk-contents.log

          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "${AAPT}"
          "${AAPT}" dump badging "build/apk/${APK_NAME}" | tee artifacts/apk-badging.txt
          grep -F "package: name='${PACKAGE_ID}'" artifacts/apk-badging.txt
          grep -F "application-label:'${APP_LABEL}'" artifacts/apk-badging.txt

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "build/apk/${APK_NAME}" \
            | tee artifacts/apk-signing.txt
          # Build-tools 36 prints "V3.0 Signer: ..." while earlier versions
          # printed "Signer #1 ...". Verify the single signer and its digest,
          # independent of that presentation label.
          grep -F "Number of signers: 1" artifacts/apk-signing.txt
          awk -v expected="${CHATGPT_SIGNER_SHA256}" '
            /certificate SHA-256 digest:/ && tolower($NF) == expected { matched = 1 }
            END { exit !matched }
          ' artifacts/apk-signing.txt

          cp "build/apk/${APK_NAME}" artifacts/apk/
          sha256sum "artifacts/apk/${APK_NAME}" | tee artifacts/apk/SHA256SUMS.txt
          printf 'author=%s\nbranch=%s\ncommit=%s\napk=%s\npackage=%s\nlabel=%s\nsigner_sha256=%s\n' \
            "ChatGPT" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${APK_NAME}" "${PACKAGE_ID}" "${APP_LABEL}" "${CHATGPT_SIGNER_SHA256}" \
            > artifacts/apk/CHECKPOINT.txt

      - name: Record evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/GROUND-RESET-EVIDENCE.md <<EOF
          # Ground reset evidence

          Source commit: \`${GITHUB_SHA}\`

          Proven for the default scene by this workflow:

          - Native body enumeration finds no retired campaign/fixture entities and checks the exact current moving-body, mechanism-kit-body and cable counts in the default scene; the separate legacy fixture inventory remains isolated.
          - Normal native locomotion, crouch, jump and grade landing execute without legacy construction.
          - The rejected fourteen-flight inclined-slab bypass is absent from native collision and the rendered scene; continuous deck rings close its exposed wells.
          - A close oblique ledge approach resolves the contacted wall face and completes a supported pull-up instead of probing sideways past the top.
          - The rendered default scene rejects retired machinery nodes and verifies actual input-driven player movement, jump, crouch and pause. Screenshots are foundation_cleared_grade.png and foundation_cleared_tower.png.
          - Normal rendered solid geometry matches the native production table; separately selected regression geometry matches its separate fixture table.
          - The native graph cross-compiles for Android arm64 and Godot exports the exact-source APK, with its native library, checkpoint identity and checksum.

          Separately proven in explicitly selected regression fixtures:

          - Retained physics/controller tests cover moving-support velocity, vault, mantle, hang, crouch, carry, parachute, falling/checkpoint behaviour and the old machine kernels.
          - Legacy intake, water screw/lift, counterweight, plant and rigging scenarios remain regression tests. Their green results do not describe normal campaign content or validate the owner's rejected screw experience.
          - The old approach-and-machine capture and audio_mix exercise the selected regression scene; they are not screenshots or device measurements of the cleared campaign.

          The default opening is the manual wooden slingshot. Native model/machine/production tests verify finite manual charging, ratchet hold, input-dependent release, restart and timestep refinement. Normal viewport touch verifies boarding, manual draw, release, the humanoid orbit and return to first person. Persistent settings and native restarts cover Grade and all 32 supported tower rings through +352 m. Slingshot sound clips and gameplay output pass decoded/mixed audio checks. Launch, pouch and character views are captured in artifacts/screenshots/slingshot; screenshots and image inspection are optional diagnostics and do not gate delivery.

          This record is emitted only after the preceding verification and export gates succeed. The old pipe bridge is explicitly selected for historical opening/upper-route regressions. Those tests cover the former continuous grade-to-+110 m route, teeter physics, braced-bay jump/crouch/recovery and north-frame climb/hang/shimmy/checkpoint. They preserve those authored encounters; their result does not establish a continuous route from the current slingshot. The new launcher tests separately report actual current-world flight and supported landing observations.

          Desktop rendering evidence is captured explicitly by the touch_north_frame scenario under artifacts/screenshots/north_*.png, including teeter, braced-bay and north-frame poses. Native and runtime assertions are delivery gates; PNG creation and image inspection are optional diagnostics. Android delivery evidence is the separately cross-compiled, exported and signature-checked APK from this source commit.

          Not proven: APK installation or Android execution, device visual readability, touch ergonomics, sustained Fold frame rate, thermals or a complete current-opening campaign playthrough.
          EOF

      - name: Retain failed-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ScraperX-diagnostics-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve Android updates across download channels
        uses: IssisX/ScraperX/.github/actions/stable-apk@882517e021841deaa915c86bbb3e92bbf4fda185
        with:
          files: artifacts/**/*.apk
          keystore: ${{ secrets.SCRAPERX_APK_KEYSTORE_B64 }}
          password: ${{ secrets.SCRAPERX_APK_KEYSTORE_PASSWORD }}

      - name: Publish immutable checkpoint build and evidence
        uses: actions/upload-artifact@v4
        with:
          name: ScraperX-build-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
