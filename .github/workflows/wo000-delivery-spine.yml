name: ScraperX — full proof path (kernel WO-000..013 + ascent AS-001..AS-002)

on:
  push:
    # ScraperX-Claude is the write/implementation branch. ScraperX-2 carries its
    # own copy of this workflow, so listing it here was inert routing.
    # <agent>/integrate-* branches get the proof run on push, for agents that
    # cannot dispatch it; off ScraperX-Claude it still stops at the signing step
    # in publish-checkpoint after every proof job is green.
    branches: [ScraperX-Claude, '*/integrate-*']
  workflow_dispatch:

permissions:
  contents: read

# Every commit is an immutable build candidate. A newer push must never cancel an
# older commit's build, otherwise that commit can lose its APK. "Build candidate",
# not "checkpoint": a checkpoint in ScraperX is the in-sim commit_checkpoint(), and
# the word is not reused for CI artifacts.
concurrency:
  group: scraperx-checkpoint-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7-stable
  GODOT_BINARY_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  GODOT_TEMPLATES_SHA256: 9714459dc071907c0f3d5f17d608faf69e7cda21331fc5d39c4503ffa4e99eec
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_VERSION: 29.0.14206865
  # Compiler cache (ccache) for every native build. CMake reads these
  # two variables on first configure; the cache only skips recompiling identical
  # inputs, so the binaries and every proof are unchanged. The Jolt build uses a
  # precompiled header, which ccache accepts only with this sloppiness.
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: /home/runner/.cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1500M

jobs:
  host-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify story radio source assets and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json; from pathlib import Path; from ci.verify_story_radio_package import verify_recordings; p = Path("godot/audio/story_radio"); verify_recordings(p, json.loads((p / "manifest.json").read_text())); print("STORY_RADIO_SOURCE PASS")'

      - name: Restore the FetchContent dependency cache (Jolt, godot-cpp, Monocypher)
        uses: actions/cache@v4
        with:
          path: build/host/_deps
          key: deps-host-ubuntu2404-${{ hashFiles('CMakeLists.txt', 'third_party/jolt_patch.cmake') }}

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-host-ubuntu2404-${{ github.sha }}
          restore-keys: |
            ccache-host-ubuntu2404-

      - name: Install host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ninja-build ccache

      - name: Build native host graph
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSCRAPERX_BUILD_BRIDGE=ON \
            -DSCRAPERX_WITH_JOLT=ON \
            -DGODOTCPP_TARGET=template_release
          cmake --build build/host --target scraperx_sim_tests scraperx_shared_survival_tests scraperx_parkour_flow_tests scraperx_native --parallel 4
          test -s build/host/scraperx_sim_tests
          test -s build/host/scraperx_shared_survival_tests
          test -s build/host/scraperx_parkour_flow_tests
          test -s godot/addons/scraperx_native/bin/linux/libscraperx_native.so

      - name: Verify every CTest test runs in exactly one shard
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check_ctest_shard_coverage.py \
            --workflow .github/workflows/wo000-delivery-spine.yml \
            --test-dir build/host

      - name: Verify every touch scenario runs in a touch shard
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check_touch_shard_coverage.py \
            --workflow .github/workflows/wo000-delivery-spine.yml \
            --driver godot/presentation/ui/ui_test_driver.gd

      - name: Verify every godot test runs in CI or is a known gap
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check_godot_test_coverage.py \
            --workflow .github/workflows/wo000-delivery-spine.yml \
            --test-dir godot/tests

      - name: Verify no owner-blocked change rides this branch
        shell: bash
        run: |
          set -euo pipefail
          # The rule check is the pre-landing gate in AGENTS.md: a BLOCK is a
          # protected file, a removed or loosened test check, or a budget
          # number changed. CI green must not bless a branch carrying one,
          # so this step fails only on BLOCK. REVIEW findings still pass
          # and stay for the reviewer, as they do in a local run.
          # The step must never pass vacuously, so it fails loudly when
          # the merge-base with trunk cannot be computed.
          git fetch --depth=1 origin ScraperX-Claude
          TRUNK="$(git rev-parse FETCH_HEAD)"
          git fetch --deepen=100 origin || true
          MB="$(git merge-base "$TRUNK" HEAD)" || { echo "rule_check: cannot compute merge-base with trunk"; exit 1; }
          echo "rule_check: trunk $TRUNK merge-base $MB head $(git rev-parse HEAD)"
          rc=0
          python3 tools/rule_check/rule_check.py "$TRUNK" HEAD || rc=$?
          if [ "$rc" -eq 2 ]; then echo "rule_check: BLOCK found, failing"; exit 1; fi
          echo "rule_check: no BLOCK (exit $rc)"

      - name: Share host native binaries with test jobs
        uses: actions/upload-artifact@v4
        with:
          name: host-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/host/CTestTestfile.cmake
            build/host/DartConfiguration.tcl
            build/host/_deps/*/CTestTestfile.cmake
            build/host/scraperx_sim_tests
            build/host/scraperx_shared_survival_tests
            build/host/scraperx_parkour_flow_tests
            godot/addons/scraperx_native/bin/linux/libscraperx_native.so
          if-no-files-found: error
          retention-days: 1

  native-tests:
    needs: host-build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard:
          - athletic-traversal
          - matron-slices-1
          - matron-slices-2
          - matron-slices-3

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Download host native binaries
        uses: actions/download-artifact@v4
        with:
          name: host-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore executable permissions on host test binaries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/host/scraperx_sim_tests build/host/scraperx_shared_survival_tests build/host/scraperx_parkour_flow_tests
          mkdir -p artifacts

      - name: Run athletic_traversal, shared_survival, parkour_flow and verify all falsifier proof lines
        if: matrix.shard == 'athletic-traversal'
        shell: bash
        run: |
          set -euo pipefail
          # Runs scraperx_sim.shared_survival, scraperx_sim.athletic_traversal, and
          # scraperx_sim.parkour_flow once via ctest -V so every PASS line is captured
          # directly without re-running the 14-minute binary a second time.
          ctest --test-dir build/host \
            -R "^scraperx_sim\.(shared_survival|athletic_traversal|parkour_flow)$" \
            -V --output-on-failure | tee artifacts/native-falsifiers.log
          grep -F "100% tests passed" artifacts/native-falsifiers.log
          grep -F "PASS scraperx_sim parkour flow" artifacts/native-falsifiers.log
          cp artifacts/native-falsifiers.log artifacts/parkour-flow.log
          cp artifacts/native-falsifiers.log artifacts/native-tests-athletic-traversal.log
          for proof in \
            "PASS scraperx_sim pulley seam" \
            "PASS scraperx_sim moving-support truth" \
            "PASS scraperx_sim athletic traversal" \
            "PASS scraperx_sim fall/parachute/checkpoint" \
            "PASS scraperx_sim world solids" \
            "PASS scraperx_sim body order" \
            "PASS scraperx_sim edge stand" \
            "PASS scraperx_sim crouch" \
            "PASS scraperx_sim kerb" \
            "PASS scraperx_sim low edge" \
            "PASS scraperx_sim S1 step on and off" \
            "PASS scraperx_sim S1 ride" \
            "PASS scraperx_sim S1 stay aboard" \
            "PASS scraperx_sim C1 climb" \
            "PASS scraperx_sim Stack to deck 4" \
            "PASS scraperx_sim S2 at rest" \
            "PASS scraperx_sim S2 ride" \
            "PASS scraperx_sim Stack to deck 6" \
            "PASS scraperx_sim C2 climb" \
            "PASS scraperx_sim S3 at rest" \
            "PASS scraperx_sim S3 ride" \
            "PASS scraperx_sim C3 climb" \
            "PASS scraperx_sim Stack to deck 14" \
            "PASS scraperx_sim Stack to Ring 176" \
            "PASS scraperx_sim Stack to Ring 220" \
            "PASS scraperx_sim Mega-Ascent Grade to 220m" \
            "PASS scraperx_sim AS-006 A no link" \
            "PASS scraperx_sim AS-006 A ride" \
            "PASS scraperx_sim AS-006 B no link" \
            "PASS scraperx_sim AS-006 B ride" \
            "PASS scraperx_sim AS-006 C no link" \
            "PASS scraperx_sim AS-006 C ride" \
            "PASS scraperx_sim AS-006 band" \
            "PASS scraperx_sim AS-006 route" \
            "PASS scraperx_sim AS-006 wreckage B" \
            "PASS scraperx_sim AS-006 wreckage C" \
            "PASS scraperx_sim AS-007 D" \
            "PASS scraperx_sim AS-007 E" \
            "PASS scraperx_sim AS-007 F" \
            "PASS scraperx_sim AS-007 band" \
            "PASS scraperx_sim AS-007 route" \
            "PASS scraperx_sim AS-008 G" \
            "PASS scraperx_sim AS-008 H" \
            "PASS scraperx_sim AS-008 I" \
            "PASS scraperx_sim AS-008 band" \
            "PASS scraperx_sim AS-008 route" \
            "PASS scraperx_sim AS-008 wreckage G" \
            "PASS scraperx_sim AS-008 wreckage I" \
            "PASS scraperx_sim AS-008 wreckage H" \
            "PASS scraperx_sim AS-009 J" \
            "PASS scraperx_sim AS-009 K" \
            "PASS scraperx_sim AS-009 L" \
            "PASS scraperx_sim AS-009 band" \
            "PASS scraperx_sim AS-009 route" \
            "PASS scraperx_sim AS-009 wreckage K" \
            "PASS scraperx_sim AS-009 wreckage J" \
            "PASS scraperx_sim AS-009 wreckage L" \
            "PASS scraperx_sim AS-010 M" \
            "PASS scraperx_sim AS-010 C4" \
            "PASS scraperx_sim AS-010 N" \
            "PASS scraperx_sim AS-010 C5" \
            "PASS scraperx_sim AS-010 O" \
            "PASS scraperx_sim AS-010 band" \
            "PASS scraperx_sim AS-010 route" \
            "PASS scraperx_sim determinism" \
            "PASS scraperx_sim slingshot" \
            "PASS scraperx_sim swing" \
            "PASS scraperx_sim C6" \
            "PASS scraperx_sim mast" \
            "PASS scraperx_sim pitman" \
            "PASS scraperx_sim helix" \
            "PASS scraperx_sim high" \
            "PASS scraperx_sim incline" \
            "PASS scraperx_sim wheel" \
            "PASS scraperx_sim tram" \
            "PASS scraperx_sim look target" \
            "PASS scraperx_sim fabricated" \
            "PASS scraperx_sim matron room" \
            "PASS scraperx_sim ascent 154 to TP-640"
          do
            grep -F "${proof}" artifacts/native-falsifiers.log
          done
          # AS-006 Stage A, the skip lift: no link, no lift (the cage never
          # moves while the rope is on the bollard, and the stage re-rigs);
          # linked, the rider rides 22 m to 176.25 under a brake-only
          # governor, and the payload never out-earns the skip.
          awk -F'cage_worst=' '/AS-006 A no link/ {split($2,a," "); exit (a[1]+0 <= 0.05) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          grep -F "relatched=1 rerigged=1" artifacts/native-falsifiers.log
          awk -F'floor_y=' '/AS-006 A ride/ {split($2,a," "); exit (a[1]+0 >= 176.20 && a[1]+0 <= 176.30) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'peak_speed=' '/AS-006 A ride/ {split($2,a," "); exit (a[1]+0 <= 2.6) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          grep -F "rode_on_cage=1" artifacts/native-falsifiers.log
          awk -F'restored_y=' '/AS-006 A ride/ {split($2,a," "); exit (a[1]+0 >= 177.0) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          # AS-006 Stages B and C and the band: neither lifts without its link;
          # B's slip hook lets the line run at the top and the boom hangs; each
          # car stands on its dogs flush with its ring; the band rides from the
          # 154 m deck to the 220 ring in one run, re-arms A with C's rubble and
          # rides A again.
          awk -F'cage_worst=' '/AS-006 B no link/ {split($2,a," "); exit (a[1]+0 <= 0.05) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'boom_drop=' '/AS-006 B no link/ {split($2,a," "); exit (a[1]+0 <= 0.05) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'floor_y=' '/AS-006 B ride/ {split($2,a," "); exit (a[1]+0 >= 198.18 && a[1]+0 <= 198.27) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'boom_angle=' '/AS-006 B ride/ {split($2,a," "); exit (a[1]+0 >= 1.45) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          grep -F "let_go=1 rode_on_cage=1" artifacts/native-falsifiers.log
          awk -F'platform_worst=' '/AS-006 C no link/ {split($2,a," "); exit (a[1]+0 <= 0.05) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'dumpster_kg=' '/AS-006 C no link/ {split($2,a," "); exit (a[1]+0 >= 899) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'floor_y=' '/AS-006 C ride/ {split($2,a," "); exit (a[1]+0 >= 220.18 && a[1]+0 <= 220.27) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'a_cage_rubble_kg=' '/AS-006 C ride/ {split($2,a," "); exit (a[1]+0 >= 899) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          grep -F "rode_on_platform=1" artifacts/native-falsifiers.log
          awk -F'y_220=' '/AS-006 band/ {split($2,a," "); exit (a[1]+0 >= 221.0) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'spilled_kg=' '/AS-006 band/ {split($2,a," "); exit (a[1]+0 >= 899) ? 0 : 1}' \
            artifacts/native-falsifiers.log
          awk -F'again_y=' '/AS-006 band/ {split($2,a," "); exit (a[1]+0 >= 177.0) ? 0 : 1}' \
            artifacts/native-falsifiers.log

      - name: Run CTest Matron slice group 1 (ladder, hearing, climb-support, crash, tower)
        if: matrix.shard == 'matron-slices-1'
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/host \
            -R "^scraperx_sim\.(matron-ladder|matron-hearing|matron-climb-support|matron-crash|matron-tower)$" \
            -j 2 --output-on-failure | tee artifacts/native-tests-matron-1.log
          grep -F "100% tests passed" artifacts/native-tests-matron-1.log

      - name: Run CTest Matron slice group 2 (chain, towers, board-walls, ladders, stand)
        if: matrix.shard == 'matron-slices-2'
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/host \
            -R "^scraperx_sim\.(matron-chain|matron-towers|matron-board-walls|matron-ladders|matron-stand)$" \
            -j 2 --output-on-failure | tee artifacts/native-tests-matron-2.log
          grep -F "100% tests passed" artifacts/native-tests-matron-2.log

      - name: Run CTest Matron slice group 3 (remaining, chase, grab, and any new CTest slices)
        if: matrix.shard == 'matron-slices-3'
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/host \
            -E "^scraperx_sim\.(shared_survival|athletic_traversal|parkour_flow|matron-ladder|matron-hearing|matron-climb-support|matron-crash|matron-tower|matron-chain|matron-towers|matron-board-walls|matron-ladders|matron-stand)$" \
            -j 2 --output-on-failure | tee artifacts/native-tests-matron-3.log
          grep -F "100% tests passed" artifacts/native-tests-matron-3.log

      - name: Upload shard native logs
        uses: actions/upload-artifact@v4
        with:
          name: native-logs-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*.log
          if-no-files-found: error
          retention-days: 1

  godot-touch:
    needs: host-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - touch-1
          - touch-2

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Download host native library
        uses: actions/download-artifact@v4
        with:
          name: host-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore cached Godot 4.7 editor archive
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/scraperx-godot
          key: godot-editor-${{ env.GODOT_VERSION }}-${{ env.GODOT_BINARY_SHA256 }}

      - name: Install verified Godot 4.7 editor
        shell: bash
        run: |
          set -euo pipefail
          chmod +x godot/addons/scraperx_native/bin/linux/libscraperx_native.so
          mkdir -p /home/runner/.cache/scraperx-godot tools/godot godot/.godot artifacts
          if ! echo "${GODOT_BINARY_SHA256}  /home/runner/.cache/scraperx-godot/godot.zip" | sha256sum --check 2>/dev/null; then
            curl --fail --location --retry 3 \
              --output /home/runner/.cache/scraperx-godot/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          fi
          echo "${GODOT_BINARY_SHA256}  /home/runner/.cache/scraperx-godot/godot.zip" | sha256sum --check
          unzip -q /home/runner/.cache/scraperx-godot/godot.zip -d tools/godot
          mv "tools/godot/Godot_v${GODOT_VERSION}_linux.x86_64" tools/godot/godot
          chmod +x tools/godot/godot
          printf '%s\n' 'res://addons/scraperx_native/scraperx_native.gdextension' \
            > godot/.godot/extension_list.cfg
          tools/godot/godot --version

      # Blocking Android delivery gate: the touch control paths (shard 1: core traversal, buttons, and bands up to C5)
      - name: Drive control paths through the real input pipeline (shard 1)
        if: matrix.shard == 'touch-1'
        shell: bash
        run: |
          set -euo pipefail
          # Each scenario injects touch events through the
          # viewport's own input pipeline and asserts a native state change
          # (presentation/ui/ui_test_driver.gd), from core traversal to the full
          # grade -> 662 m ascent (the Stack, AS-006 to AS-009 and AS-010's
          # service lift) and each band above 220 m on its own, by touch, the
          # only way the game is played (owner, 2026-10-19: no gamepad, keyboard
          # or mouse, now or ever; their playthroughs are retired); on up AS-010's C4 climb
          # to the 684 deck, its stage N, the granular discharge hoist, to the
          # 706 deck, its C5 climb to the 728 deck and its stage O, the gravel
          # wheel, to the 750 deck (touch_stack, touch_c4, touch_n, touch_c5,
          # touch_o); the ground slingshot from the game's start onto the 220
          # ring (touch_slingshot); from that ring the swing, the ram's blow
          # and the seat's arc onto the 242 ring (touch_swing); and from the
          # 242 ring C6's climb, no ladder, to the 264 ring (touch_c6); from
          # the 264 ring C7's exposed climb, no mast, to the walkway at 291.25 m
          # (touch_c7).
          # The summit, west of the derrick's upper receiver: the dark
          # searchlight, the blocks up to the gantry, the walk off its edge
          # onto the striker plate that lights the lamp, and the runway arm,
          # a run off its end and the canopy all the way to the ground
          # (touch_summit).
          # The Matron on the 154 m deck: a sprint past her locker wakes her, a
          # quiet creep while she strains, her burst, and a sprint over the
          # rotten catwalk that she follows onto and falls through
          # (touch_matron); Stage A tripped as she nears, she steps in and
          # rides it up clinging, frail she stays on the cages when the
          # player hops to the 176 ring, and in the Turn leaps the gap
          # (touch_matron_ride); led round her deck to its line and ridden
          # down it, she follows in the Turn down the bare cable and lets go
          # over 143's band (touch_matron_line); up the ladder from her deck
          # as she bursts out, frail she stands at its foot, in the Turn she
          # comes up it after and over its head onto the 176 ring
          # (touch_matron_climb). Her first act, 154 m to the 220 ring: woken
          # by a toolbox set down at her door, a pest she carries it off and
          # undoes the cage's rope; noise on 143 makes her dangerous and she
          # comes down her corner pipe after the climber, who goes up the
          # riser meanwhile; she listens, hears them and goes back up it;
          # dangerous at the shaft's rail her hands take the climber and tear
          # an arm off; fully changed her next catch takes the second and the
          # run is hers; started again whole, up her ladder and the climbing
          # route to 220 (touch_matron_act). Knock
          # her down, then throw what you carry: a toolbox taken up, a pest
          # coming for the climber upright, a swipe up held reads THROW and
          # draws the throw's path, lifted it flies and she goes down, up
          # again, nobody dead (touch_matron_heave). The bay on her deck: led
          # round and the player east over its leaf, she drops under it and
          # holds it up on her palms, its motor stopped; UNHOOK the chain,
          # HOOK it onto the leaf, she lets go, the district starts again by
          # itself and the leaf carries the player (touch_bay). A drum of the yard's loose stock, taken off its
          # pallet, carried 3 m and set down (touch_stock). The yard's forklift
          # driven in under a pallet of drums, raised, carried off, set down
          # (touch_forklift); in under the 5 t stillage, RAISE tips its back
          # end up, heard and felt, LOWER slams it back down
          # (touch_forklift_strain). The yard crane's remote taken from its
          # cabinet, CRANE: the stick sends the hook, RAISE and LOWER hoist,
          # WALK lets go (touch_yard_crane). Its lifting magnet
          # (CRANE by the button): HOOKed on, MAGNET ON, let
          # down on the slabs it takes the top one, lifts it, MAGNET OFF
          # drops it, heard humming, taking hold and letting go
          # (touch_crane_magnet).
          # Its container spreader by touch: HOOKed on, let down on the
          # laydown's container, LOCK, the box lifted and set down, UNLOCK,
          # the twistlocks heard (touch_crane_spreader).
          # From the 264 ring the owner's vertical machines on their motors,
          # the cascade mast, the pitman lift and the barrel helix, and a
          # mantle onto TP-340 (touch_machines); and from the 750 deck the
          # crown gondola and the luffing derrick to 802.6 m (touch_high);
          # from the game's start the slab incline to deck 3 (touch_incline);
          # from deck 2 the stone wheel to deck 4 (touch_wheel); from deck 6
          # the traction tram off the east bridge to deck 8 (touch_tram).
          # Every touch scenario plays on the gesture controls, the game's
          # default: the moves by swipes and the stick's flick, the run's
          # buttons drawn too, and every swipe and flick made recognized,
          # no more and no fewer. The wall kicks (touch_wall_kick) and a
          # ladder slid down, held and jumped off (touch_ladder) by them.
          # The faint route hint, off by default, marking the ladder's hold
          # ahead when on (touch_route_hint).
          # Her chart (03_EXECUTION/UNCANNY/HER_CHART.md): a long look at the
          # Matron's oil drum on the 154 m deck, time fast-forwarded, no page
          # a second before the first is due and the drum in the page in her
          # locker after, the tower's clocks on the phone's time
          # (touch_her_chart); the START list's HER CHART (FAST): the consent
          # screen first, then the short clock, which no other start has
          # (touch_her_chart_fast); the microphone's consent at first launch,
          # NOT NOW, AUDIO > MICROPHONE on and off (its clips deleted), the
          # phone's refusal, ALLOW (touch_mic_consent); a synthetic voice cut
          # into one clip by loudness, its echo not a second early, then once,
          # faint, filtered, from structure near the player out of view,
          # uncaptioned with the captions on (touch_voice_echo).
          # The broken bridge to the second shaft at the 220 ring
          # (src/sim/twin_tower.hpp): the hook taken off its rack, up onto
          # the near step, the hook on the erection arm's bar, the swing over
          # the gap and DROP at its top onto the far half, a hook shot into
          # the trip's hood from the shaft's side, the leaf down across the
          # gap and the walk back over it to tower one (touch_twin).
          # Thirteen play again on the BUTTONS layout (a name ending
          # _buttons): jump, vault, the double tap, crouch, the quickturn,
          # the climb up and the drop from a hang, the slide, the roll, the
          # wall run, the trapeze, the wall kicks and the ladder.
          # --fixed-fps makes simulated time exact however fast the runner is.
          : > artifacts/godot-uitest-touch-1.log
          for scenario in touch_jump touch_move_look touch_body touch_gyro_aim touch_climb touch_vault touch_double_tap_vault touch_crouch touch_hang_drop touch_hang_climb touch_monkey_bars touch_swing_launch \
              touch_zipline touch_zipline_slam touch_pipe_gallery touch_slide touch_speed_vault touch_precision touch_wall_run touch_wall_climb touch_tuck touch_flow touch_springboard touch_quickturn \
              touch_hook touch_hook_rope touch_birds touch_workers touch_works touch_clouds touch_chute touch_lethal_feedback touch_arm_break touch_pause touch_wall_kick touch_ladder \
              touch_route_hint touch_jump_buttons touch_vault_buttons touch_double_tap_vault_buttons touch_crouch_buttons touch_quickturn_buttons touch_hang_climb_buttons touch_hang_drop_buttons touch_slide_buttons touch_roll_buttons touch_wall_run_buttons touch_trapeze_buttons \
              touch_wall_kick_buttons touch_ladder_buttons touch_rig touch_boom touch_debris touch_photo_id_radio touch_checkpoint touch_save touch_roll touch_roll_reduced touch_trapeze touch_teeter touch_title \
              touch_stack_upper touch_stack touch_wet touch_shop touch_crane touch_service touch_c4 touch_n touch_c5; do
            timeout 400s tools/godot/godot --headless --fixed-fps 60 --path godot \
              -- "--uitest=${scenario}" 2>&1 | tee -a artifacts/godot-uitest-touch-1.log
            grep -F "SCRAPERX_UITEST PASS ${scenario} " artifacts/godot-uitest-touch-1.log
          done
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/godot-uitest-touch-1.log; then exit 1; fi

      # Blocking Android delivery gate: the touch control paths (shard 2: stage O, upper climbs, Matron, yard machines, uncanny, and twin)
      - name: Drive control paths through the real input pipeline (shard 2)
        if: matrix.shard == 'touch-2'
        shell: bash
        run: |
          set -euo pipefail
          : > artifacts/godot-uitest-touch-2.log
          for scenario in touch_o touch_slingshot touch_swing touch_c6 touch_c7 touch_summit touch_summit_ending touch_matron touch_matron_ride touch_matron_line touch_matron_climb touch_matron_act touch_matron_heave \
              touch_bay touch_radio touch_stock touch_forklift touch_forklift_strain touch_yard_crane touch_crane_magnet touch_crane_spreader touch_machines touch_high touch_incline touch_wheel \
              touch_tram touch_her_chart touch_her_chart_fast touch_mic_consent touch_voice_echo touch_room_hearing fall_voice touch_twin; do
            timeout 400s tools/godot/godot --headless --fixed-fps 60 --path godot \
              -- "--uitest=${scenario}" 2>&1 | tee -a artifacts/godot-uitest-touch-2.log
            grep -F "SCRAPERX_UITEST PASS ${scenario} " artifacts/godot-uitest-touch-2.log
          done
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/godot-uitest-touch-2.log; then exit 1; fi

      - name: Upload shard touch logs
        uses: actions/upload-artifact@v4
        with:
          name: godot-touch-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/godot-uitest-*.log
          if-no-files-found: error
          retention-days: 1

  godot-audits-and-mix:
    needs: host-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Download host native library
        uses: actions/download-artifact@v4
        with:
          name: host-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore cached Godot 4.7 editor archive
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/scraperx-godot
          key: godot-editor-${{ env.GODOT_VERSION }}-${{ env.GODOT_BINARY_SHA256 }}

      - name: Install render prerequisites and verified Godot 4.7 editor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6
          chmod +x godot/addons/scraperx_native/bin/linux/libscraperx_native.so
          mkdir -p /home/runner/.cache/scraperx-godot tools/godot artifacts
          if ! echo "${GODOT_BINARY_SHA256}  /home/runner/.cache/scraperx-godot/godot.zip" | sha256sum --check 2>/dev/null; then
            curl --fail --location --retry 3 \
              --output /home/runner/.cache/scraperx-godot/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          fi
          echo "${GODOT_BINARY_SHA256}  /home/runner/.cache/scraperx-godot/godot.zip" | sha256sum --check
          unzip -q /home/runner/.cache/scraperx-godot/godot.zip -d tools/godot
          mv "tools/godot/Godot_v${GODOT_VERSION}_linux.x86_64" tools/godot/godot
          chmod +x tools/godot/godot
          tools/godot/godot --version

      - name: Run Godot at Fold aspect through native machine authority and capture proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/screenshots godot/.godot
          printf '%s\n' 'res://addons/scraperx_native/scraperx_native.gdextension' \
            > godot/.godot/extension_list.cfg
          grep -F 'res://addons/scraperx_native/scraperx_native.gdextension' \
            godot/.godot/extension_list.cfg
          timeout 300s xvfb-run -a -s "-screen 0 1728x1485x24" \
            tools/godot/godot --verbose --path godot --rendering-method gl_compatibility --quit-after 2400 \
            -- --ci "--capture=${GITHUB_WORKSPACE}/artifacts/screenshots/wo006-approach-and-machine.png" \
            2>&1 | tee artifacts/godot-runtime.log
          test -s artifacts/screenshots/wo006-approach-and-machine.png
          grep -F "SCRAPERX_EXTENSION_LOADED" artifacts/godot-runtime.log
          grep -F "work_order=WO-006" artifacts/godot-runtime.log
          # WO-004: the viewport is the Fold inner panel, not a phone strip.
          grep -F "SCRAPERX_WO004_VIEWPORT_PROOF" artifacts/godot-runtime.log
          grep -F "width=2160 height=1856" artifacts/godot-runtime.log
          grep -F "aspect=1.164" artifacts/godot-runtime.log
          grep -F "stretch=expand" artifacts/godot-runtime.log
          # WO-005: spawn is outdoors at grade with the tower still ahead.
          grep -F "SCRAPERX_WO005_APPROACH_PROOF" artifacts/godot-runtime.log
          grep -F "tower_height=1600" artifacts/godot-runtime.log

      # The summit must play through the rendered touch path; its last beam,
      # foreman, city, parachute and return are captured by the real viewport.
      - name: Render the complete summit ending through touch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/screenshots
          timeout 400s xvfb-run -a -s "-screen 0 1296x1114x24" \
            tools/godot/godot --path godot --rendering-method gl_compatibility --fixed-fps 60 \
            -- --uitest=touch_summit_ending "--capture=${GITHUB_WORKSPACE}/artifacts/screenshots/summit" \
            2>&1 | tee artifacts/summit-ending-rendered.log
          grep -F "SCRAPERX_UITEST PASS touch_summit_ending " artifacts/summit-ending-rendered.log
          for frame in ending_hanging_beam ending_seated_foreman ending_city ending_parachute ending_home; do
            test -s "artifacts/screenshots/summit_${frame}.png"
          done
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/summit-ending-rendered.log; then exit 1; fi

      - name: Measure the mix a player hears
        shell: bash
        run: |
          set -euo pipefail
          # The headless runs use the Dummy audio driver, which never
          # mixes, so they can only count cues. Movie Maker mixes that same
          # driver frame by frame; audio_mix (ui_test_driver.gd) captures what
          # leaves Master and requires audible ambience and footsteps above
          # 300 Hz, where a phone speaker plays, with no clipping; audio_fall
          # requires the fear voice to stand out of the ambience it ducks.
          : > artifacts/godot-audio-mix.log
          for scenario in audio_mix audio_fall; do
            timeout 900s xvfb-run -a -s "-screen 0 1296x1114x24" \
              tools/godot/godot --path godot --rendering-method gl_compatibility --fixed-fps 30 \
              --write-movie "${RUNNER_TEMP}/${scenario}.avi" -- "--uitest=${scenario}" \
              2>&1 | tee -a artifacts/godot-audio-mix.log
            rm -f "${RUNNER_TEMP}/${scenario}.avi"
            grep -F "SCRAPERX_UITEST PASS ${scenario} " artifacts/godot-audio-mix.log
          done
          if grep -E "SCRIPT ERROR|Parse Error" artifacts/godot-audio-mix.log; then exit 1; fi

      - name: World solids table matches the Godot builders
        shell: bash
        run: |
          set -euo pipefail
          # src/sim/world_solids.inc is generated from the presentation's
          # builders (godot/presentation/solid_export.gd). The native suite
          # ran against the committed table; this proves that table is
          # still exactly what the builders draw.
          timeout 300s tools/godot/godot --headless --path godot \
            -- "--export-solids=${GITHUB_WORKSPACE}/artifacts/world_solids.regenerated.inc" \
            2>&1 | tee artifacts/world-solids-export.log
          grep -F "SCRAPERX_SOLIDS boxes=" artifacts/world-solids-export.log
          diff -u src/sim/world_solids.inc artifacts/world_solids.regenerated.inc

      - name: Nothing floats
        shell: bash
        run: |
          set -euo pipefail
          # Every light, lamp, sign and piece of dressing is held up by what
          # it hangs on, and every lamp gives light of its own that reaches
          # something, and sign text lies inside the board it is painted on
          # (godot/presentation/floating_audit.gd; the owner, 2026-10-20:
          # "we should just not have floating shit").
          timeout 300s tools/godot/godot --headless --path godot \
            -- "--audit-floating=${GITHUB_WORKSPACE}/artifacts/floating.txt" \
            2>&1 | tee artifacts/floating-audit.log
          grep -F "SCRAPERX_FLOATING floating=0 loose_solids=0 dark=0 off_board=0 " artifacts/floating-audit.log

      - name: Footsteps follow the floor, not the world
        shell: bash
        run: |
          set -euo pipefail
          # A rider carried by a lift or a turning beam takes no steps; walking
          # on a carrier steps by the distance walked over it.
          timeout 120s tools/godot/godot --headless --path godot \
            --script res://tests/footstep_contact_test.gd 2>&1 | tee artifacts/footstep-contact.log
          test "$(grep -c '^FOOTSTEP_CONTACT PASS' artifacts/footstep-contact.log)" -eq 5

      - name: Her takes never repeat
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s tools/godot/godot --headless --path godot \
            --script res://tests/her_takes_test.gd 2>&1 | tee artifacts/her-takes.log
          grep -F "HER_TAKES PASS fails=0" artifacts/her-takes.log

      - name: The rip camera enters and returns without a cut or lock
        shell: bash
        run: |
          set -euo pipefail
          tools/godot/godot --headless --path godot --script res://tests/rip_shot_probe.gd 2>&1 | tee artifacts/rip-shot-probe.log
          grep -q 'RIP_SHOT PASS' artifacts/rip-shot-probe.log

      - name: The Matron's figure, eyes and hair
        shell: bash
        run: |
          set -euo pipefail
          # Her body (presentation/life/matron/, built by
          # tools/body/build_matron_body.py) loads and every part is dressed;
          # standing, her soles are on the floor; her eyes meet a viewer
          # anywhere they can turn to, within 5 degrees; her hair hangs and
          # swings when she turns.
          timeout 180s tools/godot/godot --headless --path godot \
            --script res://tests/matron_figure_test.gd 2>&1 | tee artifacts/matron-figure.log
          ! grep -q '^MATRON_FIGURE FAIL' artifacts/matron-figure.log
          test "$(grep -c '^MATRON_FIGURE PASS' artifacts/matron-figure.log)" -eq 21

      - name: Check Matron perception and physical contact presentation
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s tools/godot/godot --headless --path godot \
            --script res://tests/matron_perception_climb_test.gd 2>&1 | tee artifacts/matron-perception-climb.log
          grep -q '^MATRON_PERCEPTION_CLIMB PASS' artifacts/matron-perception-climb.log

      - name: Check Matron presentation holds, mantle, rung and ride
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s tools/godot/godot --headless --path godot \
            --script res://tests/matron_presentation_test.gd 2>&1 | tee artifacts/matron-presentation.log
          ! grep -q 'MATRON_PRESENTATION FAIL' artifacts/matron-presentation.log
          grep -q '^MATRON_PRESENTATION PASS$' artifacts/matron-presentation.log

      - name: Check Matron hold haptics fire once per event
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s tools/godot/godot --headless --path godot \
            --script res://tests/matron_hold_haptics_test.gd 2>&1 | tee artifacts/matron-hold-haptics.log
          grep -q '^MATRON_HOLD_HAPTICS PASS' artifacts/matron-hold-haptics.log

      - name: Upload Godot audit and mix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-audits-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Restore the Android FetchContent dependency cache (Jolt, godot-cpp, Monocypher)
        uses: actions/cache@v4
        with:
          path: build/android-arm64/_deps
          key: deps-android-arm64-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('CMakeLists.txt', 'third_party/jolt_patch.cmake') }}

      - name: Restore the Android compiler cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-android-arm64-${{ github.sha }}
          restore-keys: |
            ccache-android-arm64-

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ninja-build ccache
          SDKMANAGER_PATH="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "${SDKMANAGER_PATH}"
          yes | "${SDKMANAGER_PATH}" --licenses >/dev/null || true
          "${SDKMANAGER_PATH}" "ndk;${ANDROID_NDK_VERSION}"

      - name: Cross-compile native graph for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cmake -S . -B build/android-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DSCRAPERX_BUILD_BRIDGE=ON \
            -DSCRAPERX_WITH_JOLT=ON \
            -DGODOTCPP_TARGET=template_release
          cmake --build build/android-arm64 --target scraperx_native --parallel 4
          test -s godot/addons/scraperx_native/bin/android/arm64/libscraperx_native.so
          file godot/addons/scraperx_native/bin/android/arm64/libscraperx_native.so | tee artifacts/android-native-library.log

      - name: Share Android arm64 native library
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            godot/addons/scraperx_native/bin/android/arm64/libscraperx_native.so
            artifacts/android-native-library.log
          if-no-files-found: error
          retention-days: 1

  android-apk:
    needs: [host-build, android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Download host native library
        uses: actions/download-artifact@v4
        with:
          name: host-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download Android arm64 native library
        uses: actions/download-artifact@v4
        with:
          name: android-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER_PATH="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "${SDKMANAGER_PATH}"
          yes | "${SDKMANAGER_PATH}" --licenses >/dev/null || true
          "${SDKMANAGER_PATH}" "platform-tools" "build-tools;36.1.0" "platforms;android-36"

      - name: Restore cached Godot 4.7 editor and Android export template archives
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/scraperx-godot-apk
          key: godot-apk-${{ env.GODOT_VERSION }}-${{ env.GODOT_BINARY_SHA256 }}-${{ env.GODOT_TEMPLATES_SHA256 }}

      - name: Install verified Godot 4.7 editor and Android template
        shell: bash
        run: |
          set -euo pipefail
          chmod +x godot/addons/scraperx_native/bin/linux/libscraperx_native.so
          chmod +x godot/addons/scraperx_native/bin/android/arm64/libscraperx_native.so
          mkdir -p /home/runner/.cache/scraperx-godot-apk tools/godot "${HOME}/.local/share/godot/export_templates/4.7.stable"
          if ! echo "${GODOT_BINARY_SHA256}  /home/runner/.cache/scraperx-godot-apk/godot.zip" | sha256sum --check 2>/dev/null; then
            curl --fail --location --retry 3 \
              --output /home/runner/.cache/scraperx-godot-apk/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          fi
          echo "${GODOT_BINARY_SHA256}  /home/runner/.cache/scraperx-godot-apk/godot.zip" | sha256sum --check
          unzip -q /home/runner/.cache/scraperx-godot-apk/godot.zip -d tools/godot
          mv "tools/godot/Godot_v${GODOT_VERSION}_linux.x86_64" tools/godot/godot
          chmod +x tools/godot/godot

          if ! echo "${GODOT_TEMPLATES_SHA256}  /home/runner/.cache/scraperx-godot-apk/templates.tpz" | sha256sum --check 2>/dev/null; then
            curl --fail --location --retry 3 \
              --output /home/runner/.cache/scraperx-godot-apk/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          fi
          echo "${GODOT_TEMPLATES_SHA256}  /home/runner/.cache/scraperx-godot-apk/templates.tpz" | sha256sum --check
          unzip -q -j /home/runner/.cache/scraperx-godot-apk/templates.tpz templates/android_debug.apk \
            -d "${HOME}/.local/share/godot/export_templates/4.7.stable"
          tools/godot/godot --version

      - name: Export checkpoint Android arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          CHECKPOINT_ID="${GITHUB_SHA::12}"
          APK_NAME="ScraperX-Claude-${CHECKPOINT_ID}-arm64.apk"
          mkdir -p build/apk artifacts/apk godot/.godot
          printf '%s\n' 'res://addons/scraperx_native/scraperx_native.gdextension' \
            > godot/.godot/extension_list.cfg
          # Godot's all_resources mode can package imported audio even when
          # export_presets.cfg excludes the source .ogg files. Temporarily
          # stage unapproved recordings outside res:// for this export only.
          voice_hold="$(mktemp -d)"
          restore_story_voices() {
            for voice in "${voice_hold}"/*; do
              [ -e "${voice}" ] || continue
              mv -- "${voice}" godot/audio/story_radio/
            done
            rmdir -- "${voice_hold}"
          }
          trap restore_story_voices EXIT
          for voice in godot/audio/story_radio/*.ogg godot/audio/story_radio/*.ogg.import; do
            [ -f "${voice}" ] || continue
            mv -- "${voice}" "${voice_hold}/"
          done
          tools/godot/godot --headless --path godot \
            --export-debug "Android arm64" "${GITHUB_WORKSPACE}/build/apk/${APK_NAME}" \
            2>&1 | tee artifacts/godot-android-export.log
          test -s "build/apk/${APK_NAME}"
          unzip -l "build/apk/${APK_NAME}" | tee artifacts/apk-contents.log
          grep -F "lib/arm64-v8a/libscraperx_native.so" artifacts/apk-contents.log
          cp "build/apk/${APK_NAME}" artifacts/apk/
          sha256sum "artifacts/apk/${APK_NAME}" | tee artifacts/apk/SHA256SUMS.txt
          printf 'branch=%s\ncommit=%s\napk=%s\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${APK_NAME}" \
            > artifacts/apk/CHECKPOINT.txt

      - name: Verify checkpoint Android APK identity
        shell: bash
        run: |
          set -euo pipefail
          CHECKPOINT_ID="${GITHUB_SHA::12}"
          APK_NAME="ScraperX-Claude-${CHECKPOINT_ID}-arm64.apk"
          # This branch's APK is ScraperX-Claude (com.cory.scraperx.claude), set in
          # godot/export_presets.cfg and read back from the APK itself: label,
          # package, and nothing that would stop it installing beside the other
          # AI branches' builds. Permanent for this branch.
          .github/scripts/check_apk_identity.sh "build/apk/${APK_NAME}" | tee artifacts/apk-identity.log

      - name: Verify exported story-radio package
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="ScraperX-Claude-${GITHUB_SHA::12}-arm64.apk"
          python3 ci/verify_story_radio_package.py "build/apk/${APK_NAME}"

      - name: Upload checkpoint APK and logs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  publish-checkpoint:
    needs: [host-build, native-tests, godot-touch, godot-audits-and-mix, android-build, android-apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Download proof artifacts from all jobs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ github.run_id }}-${{ github.run_attempt }}'
          merge-multiple: true
          path: staged-artifacts

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android build tools the signing step uses (apksigner)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER_PATH="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "${SDKMANAGER_PATH}"
          yes | "${SDKMANAGER_PATH}" --licenses >/dev/null || true
          "${SDKMANAGER_PATH}" "build-tools;36.1.0"

      - name: Assemble unified artifacts directory and record evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Each job uploaded its own artifacts/ folder as the artifact's root, so
          # its apk/, screenshots/ and logs download at the top of staged-artifacts;
          # a job that uploaded paths from two roots (android-build) keeps an
          # artifacts/ prefix. The host binaries (build/, godot/) are not evidence.
          for entry in staged-artifacts/* staged-artifacts/.[!.]*; do
            [ -e "${entry}" ] || continue
            case "$(basename "${entry}")" in
              build|godot) ;;
              artifacts) cp -a "${entry}/." artifacts/ ;;
              *) cp -a "${entry}" artifacts/ ;;
            esac
          done
          test -n "$(find artifacts -name '*.apk' -print -quit)"
          cat artifacts/native-tests-*.log > artifacts/native-tests.log
          cat artifacts/godot-uitest-touch-1.log artifacts/godot-uitest-touch-2.log > artifacts/godot-uitest.log
          cat > artifacts/WO-006-EVIDENCE.md <<EOF
          # WO-004..006 Evidence

          Source commit: \`${GITHUB_SHA}\`

          Proven by this workflow:

          - WO-001 fixed-step, invalid-input, static-support, and static-locomotion regressions remained green;
          - WO-002 moving-support regressions remained green: translating and rotating Jolt supports with stable entity IDs, real support-point velocity, material inherited jump momentum, and contact-point velocity matching \`v_linear + omega x r\` within the work-order tolerance;
          - native host tests proved the WO-003 traversal suite against real Jolt geometry: a vault that crosses a real rail onto a validated far landing while retaining approach momentum, a mantle that ends grounded on ledge entity 6, a ledge hang that holds against gravity on entity 7, a hang on the kinematic moving ledge (entity 8) carried at the support's own velocity and mantled onto that moving support, refusal of the obstructed landing behind entity 9/10 with no player rise, and traversal frame-partition invariance;
          - Godot 4.7 loaded the same current-source GDExtension, mirrored native support poses, jumped from support entity 3, and observed inherited momentum;
          - native host tests proved the mechanism bands' stages, bands, climbing routes and the one-run ascent from the 154 m deck to TP-640 on player inputs;
          - the Godot runtime rendered at the Galaxy Z Fold 6 inner-panel aspect (2160x1856, 1.164) with stretch=expand, an 82 degree vertical field of view and a 2600 m far plane;
          - the same runtime spawned outdoors at grade and walked the tower approach;
          - one first-person approach screenshot was captured from that runtime;
          - scripted interface scenarios drove touch through the viewport's real input pipeline, each asserting the resulting native state change;
          - the native graph cross-compiled for Android arm64-v8a;
          - Godot exported a current-source APK containing \`libscraperx_native.so\` under \`lib/arm64-v8a\` with visible label 'ScraperX-Claude' in every locale and package 'com.cory.scraperx.claude', every provider authority inside that package, no declared permission outside it and no shared user id;
          - the APK checksum, verified manifest identity, and checkpoint identity were recorded.

          Not proven here: APK installation, Android execution, Fold 6 observation on the real panel, sustained frame rate, thermals, touch ergonomics, the fall/parachute/checkpoint loop, load-bearing structural simulation, process/isolation networks, persistence, NPCs, missions, or a complete game loop.
          EOF

      - name: Preserve Android updates across download channels
        uses: IssisX/ScraperX/.github/actions/stable-apk@882517e021841deaa915c86bbb3e92bbf4fda185
        with:
          files: artifacts/**/*.apk
          keystore: ${{ secrets.SCRAPERX_APK_KEYSTORE_B64 }}
          password: ${{ secrets.SCRAPERX_APK_KEYSTORE_PASSWORD }}

      - name: Publish immutable checkpoint build and evidence
        uses: actions/upload-artifact@v4
        with:
          name: ScraperX-build-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  # The playable APK, built once the blocking Android proof passes: native
  # simulation suite, Fold-aspect runtime proof, real touch
  # control paths (from grade to +221 m Stack ascent), Android arm64 cross-compile,
  # and the APK's ScraperX-Claude identity read back from it.
  # Owner, 2026-10-28: no APK on every trunk push; playtests use a local
  # build. A manual dispatch still makes one.
  playtest-apk:
    needs: [host-build, native-tests, godot-touch, godot-audits-and-mix, android-build, android-apk]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Download verified checkpoint APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stage playtest APK
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="ScraperX-Claude-${GITHUB_SHA::12}-arm64.apk"
          mkdir -p playtest
          if [ -s "apk/${APK_NAME}" ]; then
            cp -a "apk/${APK_NAME}" "playtest/${APK_NAME}"
          elif [ -s "artifacts/apk/${APK_NAME}" ]; then
            cp -a "artifacts/apk/${APK_NAME}" "playtest/${APK_NAME}"
          fi
          test -s "playtest/${APK_NAME}"
          unzip -l "playtest/${APK_NAME}" | grep -F "lib/arm64-v8a/libscraperx_native.so"

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify playtest Android APK identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(find "${ANDROID_HOME}/build-tools" -type f -name aapt2 2>/dev/null)" ]; then
            SDKMANAGER_PATH="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
            yes | "${SDKMANAGER_PATH}" --licenses >/dev/null || true
            "${SDKMANAGER_PATH}" "build-tools;36.1.0"
          fi
          APK_NAME="ScraperX-Claude-${GITHUB_SHA::12}-arm64.apk"
          .github/scripts/check_apk_identity.sh "playtest/${APK_NAME}"

      - name: Preserve Android updates across download channels
        uses: IssisX/ScraperX/.github/actions/stable-apk@882517e021841deaa915c86bbb3e92bbf4fda185
        with:
          files: playtest/*.apk
          keystore: ${{ secrets.SCRAPERX_APK_KEYSTORE_B64 }}
          password: ${{ secrets.SCRAPERX_APK_KEYSTORE_PASSWORD }}

      - name: Publish the playtest APK
        uses: actions/upload-artifact@v4
        with:
          name: ScraperX-APK-${{ github.sha }}
          path: playtest/
          if-no-files-found: error
          retention-days: 30
