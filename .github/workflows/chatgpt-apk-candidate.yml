# Candidate prefix deliberately excludes tested-release publication.
# Full gameplay gates remain required and unchanged in the separate proof workflow.
name: ScraperX ChatGPT — downloadable APK candidate
'on':
  push:
    branches:
    - ChatGPT
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: chatgpt-apk-candidate-${{ github.sha }}
  cancel-in-progress: false
env:
  GODOT_VERSION: 4.7-stable
  GODOT_BINARY_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  GODOT_TEMPLATES_SHA256: 9714459dc071907c0f3d5f17d608faf69e7cda21331fc5d39c4503ffa4e99eec
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_VERSION: 29.0.14206865
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/ci/android/ScraperX-ChatGPT-debug.keystore
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
  CHATGPT_SIGNER_SHA256: 9a06889e7614d140f6cd1fc45634bb1e2391968a9fcc60f1608c9e50e15a1ba4
jobs:
  android-apk-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout exact source
      uses: actions/checkout@v4
    - name: Configure Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install build and render prerequisites
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes ccache ninja-build xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6
        SDKMANAGER_PATH="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
        test -x "${SDKMANAGER_PATH}"
        yes | "${SDKMANAGER_PATH}" --licenses >/dev/null || true
        "${SDKMANAGER_PATH}" "platform-tools" "build-tools;36.1.0" "platforms;android-36" "ndk;${ANDROID_NDK_VERSION}"
    - name: Install verified Godot 4.7 editor and Android template
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p tools/godot "${HOME}/.local/share/godot/export_templates/4.7.stable"
        curl --fail --location --retry 3 \
          --output tools/godot/godot.zip \
          "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
        echo "${GODOT_BINARY_SHA256}  tools/godot/godot.zip" | sha256sum --check
        unzip -q tools/godot/godot.zip -d tools/godot
        mv "tools/godot/Godot_v${GODOT_VERSION}_linux.x86_64" tools/godot/godot
        chmod +x tools/godot/godot

        curl --fail --location --retry 3 \
          --output tools/godot/templates.tpz \
          "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
        echo "${GODOT_TEMPLATES_SHA256}  tools/godot/templates.tpz" | sha256sum --check
        unzip -q -j tools/godot/templates.tpz templates/android_debug.apk \
          -d "${HOME}/.local/share/godot/export_templates/4.7.stable"
        tools/godot/godot --version
    - name: Restore native compiler cache
      id: native-compiler-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-chatgpt-native-v1-${{ hashFiles('src/**', 'tests/**', 'CMakeLists.txt', 'cmake/**', 'ci/godot-cpp-build-profile.json') }}
        restore-keys: ${{ runner.os }}-chatgpt-native-v1-
    - name: Bound native compiler cache
      run: ccache --max-size=1G
    - name: Build host bridge for Godot resource import (no gameplay test claim)
      shell: bash
      run: |
        set -euo pipefail
        cmake -S . -B build/candidate-host -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DSCRAPERX_BUILD_BRIDGE=ON -DSCRAPERX_WITH_JOLT=ON \
          -DGODOTCPP_TARGET=template_release \
          -DGODOTCPP_BUILD_PROFILE="${GITHUB_WORKSPACE}/ci/godot-cpp-build-profile.json"
        cmake --build build/candidate-host --target scraperx_native --parallel 2
        mkdir -p artifacts/apk
    - name: Check installed rig lifecycle and loaded moving-guide cable
      shell: bash
      run: |
        set -euo pipefail
        cmake --build build/candidate-host --target scraperx_rigging_system_tests scraperx_routed_cable_tests scraperx_rigging_bay_tests scraperx_rigging_public_route_tests scraperx_rigging_powered_tests scraperx_mounted_winch_public_tests scraperx_mounted_winch_crossing_tests --parallel 2
        timeout 60s build/candidate-host/scraperx_rigging_system_tests \
          2>&1 | tee artifacts/rigging-system-native.log
        timeout 60s build/candidate-host/scraperx_routed_cable_tests \
          2>&1 | tee artifacts/routed-cable-native.log
        grep -F 'PASS ROUTED_CABLE' artifacts/routed-cable-native.log
        timeout 60s build/candidate-host/scraperx_rigging_bay_tests \
          2>&1 | tee artifacts/rigging-bay-native.log
        timeout 300s build/candidate-host/scraperx_rigging_public_route_tests \
          2>&1 | tee artifacts/rigging-public-route.log
        grep -F 'PASS RIGGING_PUBLIC' artifacts/rigging-public-route.log
        timeout 60s build/candidate-host/scraperx_rigging_powered_tests \
          2>&1 | tee artifacts/rigging-powered-native.log
        timeout 300s build/candidate-host/scraperx_mounted_winch_public_tests \
          2>&1 | tee artifacts/mounted-winch-public.log
        grep -F 'PASS MOUNTED_WINCH_PUBLIC' artifacts/mounted-winch-public.log
        timeout 300s build/candidate-host/scraperx_mounted_winch_crossing_tests \
          2>&1 | tee artifacts/mounted-winch-crossing.log
        grep -F 'PASS MOUNTED_WINCH_CROSSING' artifacts/mounted-winch-crossing.log
    - name: Check reusable portable line, actual contacts and public swing/crossing
      shell: bash
      run: |
        set -euo pipefail
        checks=(grappling_gun grapple_practice_route powered_cable grapple_rope_constraint finite_line_reel rounded_box_line_path finite_cable_constraint portable_line_path portable_line_lifecycle portable_line_input portable_line_public_route material_traversal_line line_material_hand material_line_crossing portable_line_crossing_public)
        targets=()
        for check in "${checks[@]}"; do targets+=("scraperx_${check}_tests"); done
        cmake --build build/candidate-host --target "${targets[@]}" --parallel 2
        for check in "${checks[@]}"; do
          timeout 300s "build/candidate-host/scraperx_${check}_tests" \
            2>&1 | tee "artifacts/${check}-native.log"
        done
        timeout 120s build/candidate-host/scraperx_grapple_practice_route_tests long-range \
          2>&1 | tee artifacts/grapple-long-range-native.log
        grep -F 'PASS GRAPPLE_LONG_RANGE' artifacts/grapple-long-range-native.log
        timeout 120s build/candidate-host/scraperx_grapple_practice_route_tests charge \
          2>&1 | tee artifacts/grapple-charge-native.log
        grep -F 'PASS GRAPPLE_CHARGE_PUBLIC' artifacts/grapple-charge-native.log
        timeout 180s build/candidate-host/scraperx_grapple_practice_route_tests recovery-only \
          2>&1 | tee artifacts/grapple-recovery-native.log
        grep -F 'PASS GRAPPLE_ROUTE recovery-only' artifacts/grapple-recovery-native.log
        grep -F 'PASS PORTABLE_LINE_PUBLIC' artifacts/portable_line_public_route-native.log
        grep -F 'PASS PORTABLE_LINE_CROSSING_PUBLIC' artifacts/portable_line_crossing_public-native.log
    - name: Check native sleep preserves launcher and forklift work
      shell: bash
      run: |
        set -euo pipefail
        cmake --build build/candidate-host --target scraperx_slingshot_machine_tests scraperx_warehouse_forklift_tests --parallel 2
        timeout 120s build/candidate-host/scraperx_slingshot_machine_tests \
          2>&1 | tee artifacts/slingshot-sleep-native.log
        timeout 120s build/candidate-host/scraperx_warehouse_forklift_tests \
          2>&1 | tee artifacts/forklift-sleep-native.log
    - name: Check airborne catch and finite hand-supported top-out intent
      shell: bash
      run: |
        set -euo pipefail
        cmake --build build/candidate-host --target scraperx_air_catch_intent_tests scraperx_physical_hang_intent_tests scraperx_physical_topout_tests --parallel 2
        timeout 90s build/candidate-host/scraperx_air_catch_intent_tests \
          2>&1 | tee artifacts/air-catch-intent-native.log
        grep -F 'SCRAPERX_AIR_CATCH PASS' artifacts/air-catch-intent-native.log
        for mode in jump action cancel release restart duct-jump duct-action duct-cancel; do
          timeout 90s build/candidate-host/scraperx_physical_hang_intent_tests "$mode" \
            2>&1 | tee "artifacts/hang-topout-${mode}-native.log"
          grep -F "PASS PHYSICAL_HANG_INTENT mode=$mode" "artifacts/hang-topout-${mode}-native.log"
        done
        timeout 90s build/candidate-host/scraperx_physical_topout_tests \
          2>&1 | tee artifacts/physical-topout-native.log
        timeout 90s build/candidate-host/scraperx_physical_topout_tests blocked \
          2>&1 | tee artifacts/physical-topout-blocked-native.log
    - name: Check connected yard, upper gallery and wall-kick receiver
      shell: bash
      run: |
        set -euo pipefail
        cmake --build build/candidate-host \
          --target scraperx_upper_gallery_route_tests scraperx_parkour_yard_route_tests \
          scraperx_wall_exit_route_tests scraperx_physical_wall_stride_tests --parallel 2
        timeout 180s build/candidate-host/scraperx_upper_gallery_route_tests \
          2>&1 | tee artifacts/upper-gallery-native.log
        grep -F 'SCRAPERX_UPPER_GALLERY PASS' artifacts/upper-gallery-native.log
        timeout 180s build/candidate-host/scraperx_parkour_yard_route_tests \
          2>&1 | tee artifacts/parkour-yard-native.log
        grep -F 'SCRAPERX_PARKOUR_YARD PASS' artifacts/parkour-yard-native.log
        timeout 180s build/candidate-host/scraperx_wall_exit_route_tests \
          2>&1 | tee artifacts/wall-exit-native.log
        grep -F 'SCRAPERX_WALL_EXIT PASS' artifacts/wall-exit-native.log
        for mode in flow jump cancel guards; do
          timeout 60s build/candidate-host/scraperx_physical_wall_stride_tests "$mode" \
            2>&1 | tee -a artifacts/wall-stride-regression.log
          grep -F "WALL_STRIDE PASS mode=$mode" artifacts/wall-stride-regression.log
        done
    - name: Check physical story actor and public encounter state
      shell: bash
      run: |
        set -euo pipefail
        cmake --build build/candidate-host --target scraperx_physical_story_actor_tests scraperx_story_actor_public_tests --parallel 2
        timeout 120s build/candidate-host/scraperx_physical_story_actor_tests \
          2>&1 | tee artifacts/story-physical-actor-native.log
        grep -F 'PASS PHYSICAL_STORY_ACTOR' artifacts/story-physical-actor-native.log
        timeout 180s build/candidate-host/scraperx_story_actor_public_tests \
          2>&1 | tee artifacts/story-actor-public-native.log
        grep -F 'PASS STORY_ACTOR_PUBLIC' artifacts/story-actor-public-native.log
        cmake --build build/candidate-host --target scraperx_yard_worker_public_tests --parallel 2
        timeout 180s build/candidate-host/scraperx_yard_worker_public_tests \
          2>&1 | tee artifacts/yard-worker-public-native.log
        grep -F 'YARD_WORKER_PUBLIC PASS' artifacts/yard-worker-public-native.log
    - name: Cross-compile native graph for Android arm64
      shell: bash
      run: |
        set -euo pipefail
        cmake -S . -B build/android-arm64 -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DSCRAPERX_BUILD_BRIDGE=ON \
          -DSCRAPERX_WITH_JOLT=ON \
          -DGODOTCPP_TARGET=template_release \
          -DGODOTCPP_BUILD_PROFILE="${GITHUB_WORKSPACE}/ci/godot-cpp-build-profile.json"
        cmake --build build/android-arm64 --target scraperx_native --parallel 2
        test -s godot/addons/scraperx_native/bin/android/arm64/libscraperx_native.so
        file godot/addons/scraperx_native/bin/android/arm64/libscraperx_native.so | tee artifacts/android-native-library.log
        ccache --show-stats | tee artifacts/native-compiler-cache.log
    - name: Save native compiler cache before presentation gates
      if: steps.native-compiler-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.native-compiler-cache.outputs.cache-primary-key }}
    - name: Prepare visible source and Android build identity
      shell: bash
      run: python3 ci/prepare_chatgpt_build_info.py
    - name: Import shipping Godot project with matching host bridge
      shell: bash
      run: |
        set -euo pipefail
        tools/godot/godot --headless --editor --path godot --import --quit 2>&1 | tee artifacts/godot-candidate-import.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|Error loading script' artifacts/godot-candidate-import.log; then
          exit 1
        fi
    - name: Check open-hand Reach presentation
      shell: bash
      run: |
        set -euo pipefail
        timeout 60s tools/godot/godot --headless --path godot --audio-driver Dummy \
          --script res://tests/air_reach_arms_test.gd \
          2>&1 | tee artifacts/air-reach-arms.log
        grep -F 'SCRAPERX_AIR_REACH_ARMS PASS' artifacts/air-reach-arms.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/air-reach-arms.log; then exit 1; fi
    - name: Check shipping early-catch input and visible hand feedback
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p artifacts/air-reach
        timeout 90s xvfb-run -a -s '-screen 0 1280x900x24' \
          tools/godot/godot --path godot --audio-driver Dummy \
          --rendering-method gl_compatibility --resolution 1280x900 \
          res://tests/air_catch_input_test.tscn -- --quit-after-air-catch-check \
          --capture-dir="${GITHUB_WORKSPACE}/artifacts/air-reach" \
          2>&1 | tee artifacts/air-catch-input-godot.log
        grep -F 'SCRAPERX_AIR_CATCH_INPUT PASS' artifacts/air-catch-input-godot.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/air-catch-input-godot.log; then exit 1; fi
    - name: Check selectable thumb controls and safe gesture routing
      shell: bash
      run: |
        set -euo pipefail
        timeout 60s tools/godot/godot --headless --path godot --audio-driver Dummy \
          --script res://tests/thumb_profile_settings_test.gd \
          2>&1 | tee artifacts/thumb-profile-settings.log
        grep -F 'SCRAPERX_THUMB_PROFILE_SETTINGS PASS' artifacts/thumb-profile-settings.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/thumb-profile-settings.log; then exit 1; fi
        timeout 60s tools/godot/godot --headless --path godot --audio-driver Dummy \
          --script res://tests/thumb_parkour_controls_test.gd \
          2>&1 | tee artifacts/thumb-controls.log
        grep -F 'SCRAPERX_THUMB_CONTROLS PASS' artifacts/thumb-controls.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/thumb-controls.log; then exit 1; fi
    - name: Check carried gun touch travel through the shipping native scene
      shell: bash
      run: |
        set -euo pipefail
        timeout 60s tools/godot/godot --headless --path godot --audio-driver Dummy \
          --script res://tests/toolbelt_touch_test.gd \
          2>&1 | tee artifacts/toolbelt-touch.log
        grep -F 'TOOLBELT_TOUCH PASS' artifacts/toolbelt-touch.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/toolbelt-touch.log; then exit 1; fi
        timeout 60s tools/godot/godot --headless --path godot --audio-driver Dummy \
          --script res://tests/grapple_primary_touch_test.gd \
          2>&1 | tee artifacts/grapple-primary-touch.log
        grep -F 'GRAPPLE_PRIMARY_TOUCH PASS' artifacts/grapple-primary-touch.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/grapple-primary-touch.log; then exit 1; fi
        timeout 90s tools/godot/godot --headless --path godot --audio-driver Dummy \
          --script res://tests/grapple_toolbelt_input_test.gd \
          2>&1 | tee artifacts/grapple-toolbelt-input.log
        grep -F 'GRAPPLE_TOOLBELT_INPUT PASS' artifacts/grapple-toolbelt-input.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/grapple-toolbelt-input.log; then exit 1; fi
        timeout 60s tools/godot/godot --headless --path godot --audio-driver Dummy \
          --script res://tests/grapple_aim_preview_view_test.gd \
          2>&1 | tee artifacts/grapple-aim-view.log
        grep -F 'GRAPPLE_AIM_VIEW checks=' artifacts/grapple-aim-view.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/grapple-aim-view.log; then exit 1; fi
        timeout 120s tools/godot/godot --headless --path godot --audio-driver Dummy \
          --script res://tests/grapple_charge_input_test.gd \
          2>&1 | tee artifacts/grapple-charge-input.log
        grep -F 'GRAPPLE_CHARGE_INPUT PASS' artifacts/grapple-charge-input.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/grapple-charge-input.log; then exit 1; fi
        timeout 120s tools/godot/godot --headless --path godot --audio-driver Dummy \
          --script res://tests/grapple_trip_input_test.gd \
          2>&1 | tee artifacts/grapple-trip-input.log
        grep -F 'SCRAPERX_GRAPPLE_TRIP_INPUT PASS' artifacts/grapple-trip-input.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/grapple-trip-input.log; then exit 1; fi
    - name: Check story opening, actual arrivals and voiced discovery
      shell: bash
      run: |
        set -euo pipefail
        for entry in story_guidance:STORY_GUIDANCE story_presenter:STORY_PRESENTER story_radio_player:STORY_RADIO story_discovery:STORY_DISCOVERY story_handover:STORY_HANDOVER story_handover_input:SCRAPERX_STORY_HANDOVER_INPUT story_opening_input:SCRAPERX_STORY_OPENING opening_journey_input:SCRAPERX_OPENING_JOURNEY service_ascent_input:SCRAPERX_SERVICE_ASCENT inspection_rail_input:SCRAPERX_INSPECTION_RAIL swing_stair_input:SCRAPERX_SWING_STAIR_INPUT story_discovery_input:SCRAPERX_STORY_DISCOVERY; do
          check="${entry%%:*}"
          marker="${entry#*:}"
          timeout 120s tools/godot/godot --headless --path godot --audio-driver Dummy \
            --script "res://tests/${check}_test.gd" \
            2>&1 | tee "artifacts/story-${check}.log"
          grep -F "${marker} PASS" "artifacts/story-${check}.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' "artifacts/story-${check}.log"; then exit 1; fi
        done
    - name: Check optional local portrait and voiced double encounter
      shell: bash
      run: |
        set -euo pipefail
        for entry in 'player_identity:PLAYER_IDENTITY failures=0' 'work_id_page:WORK_ID_PAGE PASS' 'portrait_calibration:PORTRAIT_CALIBRATION PASS' 'portrait_face_fit:PORTRAIT_FACE_FIT PASS' 'story_human_gait:STORY_HUMAN_GAIT PASS' 'story_double_encounter:STORY_DOUBLE PASS' 'story_actor_voice:STORY_ACTOR_VOICE PASS' 'story_actor_input:SCRAPERX_STORY_ACTOR_INPUT PASS'; do
          check="${entry%%:*}"
          marker="${entry#*:}"
          timeout 180s tools/godot/godot --headless --path godot --audio-driver Dummy \
            --script "res://tests/${check}_test.gd" \
            2>&1 | tee "artifacts/story-${check}.log"
          grep -F "${marker}" "artifacts/story-${check}.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' "artifacts/story-${check}.log"; then exit 1; fi
        done
    - name: Check handover photo replacement and removal on actual rendered screen
      shell: bash
      run: |
        set -euo pipefail
        timeout 60s xvfb-run -a -s '-screen 0 800x600x24' \
          tools/godot/godot --path godot --audio-driver Dummy --rendering-method gl_compatibility \
          --script res://tests/story_handover_identity_render_test.gd \
          2>&1 | tee artifacts/story-handover-identity-render.log
        grep -F 'STORY_HANDOVER_IDENTITY_RENDER PASS' artifacts/story-handover-identity-render.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/story-handover-identity-render.log; then exit 1; fi
    - name: Check rigging touch controls and actual shipping native view
      shell: bash
      run: |
        set -euo pipefail
        timeout 60s tools/godot/godot --headless --path godot --audio-driver Dummy \
          --script res://tests/rigging_controls_test.gd \
          2>&1 | tee artifacts/rigging-controls.log
        grep -F 'RIGGING_CONTROLS PASS' artifacts/rigging-controls.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/rigging-controls.log; then exit 1; fi
        timeout 60s tools/godot/godot --headless --path godot --audio-driver Dummy \
          --script res://tests/portable_line_controls_test.gd \
          2>&1 | tee artifacts/portable-line-controls.log
        grep -F 'PORTABLE_LINE_CONTROLS checks=' artifacts/portable-line-controls.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/portable-line-controls.log; then exit 1; fi
        mkdir -p artifacts/portable-line
        timeout 90s xvfb-run -a -s '-screen 0 1280x900x24' \
          tools/godot/godot --path godot --audio-driver Dummy --rendering-method gl_compatibility \
          --script res://tests/portable_line_native_input_test.gd \
          -- --portable-line-capture-dir="${GITHUB_WORKSPACE}/artifacts/portable-line" \
          2>&1 | tee artifacts/portable-line-native-input.log
        grep -F 'SCRAPERX_PORTABLE_LINE_NATIVE_INPUT PASS' artifacts/portable-line-native-input.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/portable-line-native-input.log; then exit 1; fi
        timeout 90s xvfb-run -a -s '-screen 0 1280x900x24' \
          tools/godot/godot --path godot --audio-driver Dummy --rendering-method gl_compatibility \
          --script res://tests/portable_line_crossing_input_test.gd \
          -- --portable-crossing-capture-dir="${GITHUB_WORKSPACE}/artifacts/portable-line" \
          2>&1 | tee artifacts/portable-line-crossing-input.log
        grep -F 'SCRAPERX_PORTABLE_CROSSING_INPUT PASS' artifacts/portable-line-crossing-input.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/portable-line-crossing-input.log; then exit 1; fi
        mkdir -p artifacts/rigging
        timeout 90s xvfb-run -a -s '-screen 0 1280x900x24' \
          tools/godot/godot --path godot --audio-driver Dummy \
          --rendering-method gl_compatibility --script res://tests/rigging_native_input_test.gd \
          -- --rigging-capture-dir="${GITHUB_WORKSPACE}/artifacts/rigging" \
          2>&1 | tee artifacts/rigging-native-input.log
        grep -F 'SCRAPERX_RIGGING_NATIVE_INPUT PASS' artifacts/rigging-native-input.log
        if grep -E 'SCRIPT ERROR:|Parse Error:|FAIL' artifacts/rigging-native-input.log; then exit 1; fi
        timeout 180s xvfb-run -a -s '-screen 0 1280x900x24' \
          tools/godot/godot --path godot --audio-driver Dummy \
          --rendering-method gl_compatibility --script res://tests/mounted_winch_input_test.gd \
          -- --mounted-winch-capture-dir="${GITHUB_WORKSPACE}/artifacts/rigging" \
          2>&1 | tee artifacts/mounted-winch-input.log
